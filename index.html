<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Okuduğum Kitaplar</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  
  <!-- React Kütüphaneleri -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  
  <!-- Babel (JSX'i tarayıcıda çalıştırmak için) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
        font-family: 'Inter', sans-serif;
    }
    h1, h2, h3.font-montserrat {
        font-family: 'Montserrat', sans-serif;

        filter: drop-shadow(0 0 5px #fef08a) drop-shadow(0 0 10px #fef08a);

</head>
<body class="bg-slate-900">

  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";
    window.firebase = { 
        initializeApp, 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { 
        initializeApp, 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
    } = window.firebase;

    // Firebase yapılandırması
    const firebaseConfig = {
      apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
      authDomain: "okudugumkitaplarapp.firebaseapp.com",
      projectId: "okudugumkitaplarapp",
      storageBucket: "okudugumkitaplarapp.firebasestorage.app",
      messagingSenderId: "292934565697",
      appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
      measurementId: "G-V0EFGVV2CR"
    };

    const appId = firebaseConfig.projectId;

    // Hazır Tür Şablonları (Alfabetik Sıralı)
    const PREDEFINED_GENRES = [
        "Anı", "Antoloji", "Araştırma", "Bilim Kurgu", "Biyografi", "Çizgi Roman", "Çocuk Kitabı",
        "Deneme", "Derleme", "Din / Tasavvuf", "Fantastik", "Felsefe", 
        "Gezi Yazısı", "Günlük", "Hatıra", "Hikâye", "Kişisel Gelişim", "Makale", "Mülakat",
        "Otobiyografi", "Psikoloji", "Roman", "Röportaj", "Siyaset", "Sohbet",
        "Söyleşi", "Sözlük", "Şiir", "Tarih", "Tiyatro", "Diğer"
    ];

    function App() {
      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [userId, setUserId] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      
      const [searchTerm, setSearchTerm] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [readBooks, setReadBooks] = useState([]);
      const [libraryBooks, setLibraryBooks] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState(null); 
      
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false); 
      const [showLibrary, setShowLibrary] = useState(false); 
      const [userName, setUserName] = useState('');
      const [userSurname, setUserSurname] = useState('');
      
      const [readBooksFilterTerm, setReadBooksFilterTerm] = useState('');
      const [readBooksGenreFilter, setReadBooksGenreFilter] = useState(''); // Yeni: Tür Filtresi
      const [readBooksSortBy, setReadBooksSortBy] = useState('dateDesc'); // Yeni En Üstte
      
      const [libraryFilterTerm, setLibraryFilterTerm] = useState('');
      const [libraryGenreFilter, setLibraryGenreFilter] = useState(''); // Yeni: Tür Filtresi
      const [librarySortBy, setLibrarySortBy] = useState('author'); 
      
      const [editingBook, setEditingBook] = useState(null);
      const [plainTextImportList, setPlainTextImportList] = useState('');
      const [manualAddTarget, setManualAddTarget] = useState(null); 
      const [manualBook, setManualBook] = useState({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: '' });
      
      const [selectedAuthorBooks, setSelectedAuthorBooks] = useState([]);
      const [selectedAuthorName, setSelectedAuthorName] = useState('');
      const [selectedPublisherBooks, setSelectedPublisherBooks] = useState([]);
      const [selectedPublisherName, setSelectedPublisherName] = useState('');
      const [selectedGenreBooks, setSelectedGenreBooks] = useState([]); // Yeni: Tür İstatistiği İçin
      const [selectedGenreName, setSelectedGenreName] = useState(''); // Yeni: Tür İstatistiği İçin
      const [selectedBookDetails, setSelectedBookDetails] = useState(null);
      
      const [statsSearchTerm, setStatsSearchTerm] = useState('');
      const [statsTab, setStatsTab] = useState('authors'); // authors, publishers, genres
      const [showBackToTop, setShowBackToTop] = useState(false);
      const [confirmation, setConfirmation] = useState(null);

      const getTodayDate = () => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const formatDisplayDate = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) {
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }
        return dateString;
      };

      useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      const formatTitle = (title) => {
        if (!title) return '';
        return title
            .toLocaleLowerCase('tr-TR')
            .split(' ')
            .map(word => word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1))
            .join(' ');
      };

      const standardizeAuthorName = (author) => {
        if (!author) return '';
        const lowerCaseAuthor = author.toLocaleLowerCase('tr-TR').trim();
        const omerSeyfettinVariations = ['ömer seyfettin', 'omer seyfettin', 'ö. seyfettin', 'o. seyfettin', 'ö.seyfettin', 'o.seyfettin', 'ö. seyfetin', 'o. seyfetin'];
        const halidZiyaVariations = ['halid ziya', 'halit ziya', 'hâlid ziya', 'halid ziya uşaklıgil', 'halit ziya uşaklıgil', 'hâlid ziya uşaklıgil'];

        if (omerSeyfettinVariations.includes(lowerCaseAuthor)) {
          return 'Ömer Seyfettin';
        }
        if (halidZiyaVariations.includes(lowerCaseAuthor)) {
          return 'Halid Ziya Uşaklıgil';
        }
        return author;
      };

      const formatAuthor = (author) => {
        if (!author) return '';
        let standardized = standardizeAuthorName(author);
        return standardized.split(' ').map(word => {
          if (!word) return '';
          return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1).toLocaleLowerCase('tr-TR');
        }).join(' ');
      };
      
      const getAuthorStats = () => {
        const stats = {};
        readBooks.forEach(book => {
          const authors = book.authors ? book.authors.split(',').map(a => a.trim()).filter(a => a.length > 0) : [];
          authors.forEach(author => {
            const standardizedAuthor = formatAuthor(author);
            if (!stats[standardizedAuthor]) {
              stats[standardizedAuthor] = { count: 0, books: [] };
            }
            stats[standardizedAuthor].count++;
            stats[standardizedAuthor].books.push(book.title);
          });
        });
        let sortedAuthors = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) {
          sortedAuthors = sortedAuthors.filter(([authorName]) =>
            authorName.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR'))
          );
        }
        return sortedAuthors;
      };

      const getPublisherStats = () => {
        const stats = {};
        readBooks.forEach(book => {
            const publisher = book.publisher || "Bilinmiyor";
            if(publisher === "Yayınevi Bilgisi Yok" || publisher === "Bilinmiyor") return;

            if (!stats[publisher]) {
              stats[publisher] = { count: 0, books: [] };
            }
            stats[publisher].count++;
            stats[publisher].books.push(book.title);
        });
        let sortedPublishers = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) {
          sortedPublishers = sortedPublishers.filter(([publisherName]) =>
            publisherName.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR'))
          );
        }
        return sortedPublishers;
      };

      // YENİ: Tür istatistikleri
      const getGenreStats = () => {
        const stats = {};
        readBooks.forEach(book => {
            const genre = book.genre || "Bilinmiyor";
            if(genre === "Bilinmiyor") return;

            if (!stats[genre]) {
              stats[genre] = { count: 0, books: [] };
            }
            stats[genre].count++;
            stats[genre].books.push(book.title);
        });
        let sortedGenres = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) {
          sortedGenres = sortedGenres.filter(([genreName]) =>
            genreName.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR'))
          );
        }
        return sortedGenres;
      };

      const handleAuthorClick = (authorName, books) => {
        setSelectedAuthorName(authorName);
        setSelectedAuthorBooks(books);
      };

      const handlePublisherClick = (publisherName, books) => {
        setSelectedPublisherName(publisherName);
        setSelectedPublisherBooks(books);
      };

      const handleGenreClick = (genreName, books) => {
        setSelectedGenreName(genreName);
        setSelectedGenreBooks(books);
      };

      const handleBookClickInStats = (bookTitle) => {
        const book = readBooks.find(b => b.title === bookTitle);
        if(book) {
            setSelectedBookDetails(book);
        }
      };

      const openEditModal = (book, source) => setEditingBook({ ...book, source });
      const closeEditModal = () => setEditingBook(null);
      
      const resetManualBookForm = () => {
        setManualBook({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: getTodayDate() });
      };

      useEffect(() => {
        try {
          const app = initializeApp(firebaseConfig);
          const authInstance = getAuth(app);
          const firestoreInstance = getFirestore(app);
          setAuth(authInstance);
          setDb(firestoreInstance);
          const unsubscribe = onAuthStateChanged(authInstance, user => {
            setUserId(user ? user.uid : null);
            setIsAuthReady(true);
          });
          return () => unsubscribe();
        } catch (err) {
          setError("Firebase başlatılamadı.");
        }
      }, []);

      useEffect(() => {
        if (!isAuthReady || !db || !userId) return;

        const booksUnsubscribe = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), snapshot => {
          setReadBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const libraryUnsubscribe = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/libraryBooks`), snapshot => {
          setLibraryBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const profileUnsubscribe = onSnapshot(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), docSnap => {
          if (docSnap.exists()) {
            const { userName = '', userSurname = '' } = docSnap.data();
            setUserName(userName);
            setUserSurname(userSurname);
          } else {
            setUserName('');
            setUserSurname('');
          }
        });
        return () => { 
            booksUnsubscribe(); 
            libraryUnsubscribe();
            profileUnsubscribe(); 
        };
      }, [isAuthReady, db, userId]);

      const showMessage = (content, type) => {
        setMessage({ content, type });
        setTimeout(() => setMessage(null), 4000);
      };
      
      const saveUserProfile = async () => {
        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        try {
          await setDoc(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), { userName, userSurname }, { merge: true });
          showMessage('Profil bilgileri kaydedildi!', 'success');
        } catch (e) { showMessage("Profil kaydedilirken hata oluştu.", "error"); }
      };
      
      const exportData = () => {
        if (readBooks.length === 0) return showMessage('Dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = readBooks.map(book => `${book.title} - ${book.authors} | Tür: ${book.genre || '-'} ${book.readDate ? `(Okuma: ${formatDisplayDate(book.readDate)})` : ''}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'okudugum_kitaplar.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showMessage('Veri başarıyla metin dosyası olarak dışa aktarıldı!', 'success');
      };
      
      const exportLibraryData = () => {
        if (libraryBooks.length === 0) return showMessage('Kütüphanede dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = libraryBooks.map(book => `${book.title} - ${book.authors} | Tür: ${book.genre || '-'}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'kutuphanem.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showMessage('Kütüphane verisi başarıyla metin dosyası olarak dışa aktarıldı!', 'success');
      };
      
      const handlePlainTextImport = async () => {
        if (!plainTextImportList.trim() || !db || !userId) return showMessage('İçe aktarılacak liste boş veya kullanıcı oturumu hazır değil.', 'error');
        const lines = plainTextImportList.split('\n').filter(line => line.trim().length > 0);
        const existingBooks = new Set([...readBooks, ...libraryBooks].map(b => `${b.title.toLocaleLowerCase('tr-TR')}-${b.authors.toLocaleLowerCase('tr-TR')}`));
        const newBooksToAdd = [];
        
        lines.forEach(line => {
            let title = line.trim(), authors = 'Bilinmiyor';
            const separatorMatch = line.match(/(.*)\s*[-–—]\s*(.*)$/);
            if (separatorMatch) { [ ,title, authors] = separatorMatch.map(s => s.trim()); }
            const formattedTitle = formatTitle(title), formattedAuthors = formatAuthor(authors);
            const bookKey = `${formattedTitle.toLocaleLowerCase('tr-TR')}-${formattedAuthors.toLocaleLowerCase('tr-TR')}`;
            if (!existingBooks.has(bookKey)) {
                newBooksToAdd.push({ title: formattedTitle, authors: formattedAuthors, publisher: '', genre: 'Bilinmiyor', notes: '', readDate: '' }); 
                existingBooks.add(bookKey);
            }
        });
        if (newBooksToAdd.length === 0) return showMessage('Yeni kitap bulunamadı veya tümü zaten listenizde.', 'info');
        try {
            const batch = writeBatch(db);
            newBooksToAdd.forEach(book => {
                const newDocRef = doc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
                batch.set(newDocRef, book);
            });
            await batch.commit();
            showMessage(`${newBooksToAdd.length} kitap okunanlar listesine başarıyla eklendi!`, 'success');
            setPlainTextImportList(''); setShowSettings(false);
        } catch (e) { showMessage('Kitaplar içe aktarılırken bir hata oluştu.', 'error'); }
      };

      const searchBooks = async () => {
        if (!searchTerm.trim()) return showMessage('Arama terimi girin.', 'error');
        setLoading(true); setError(''); setSearchResults([]);
        try {
          const openLibraryResponse = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchTerm)}&limit=10`);
          const data = await openLibraryResponse.json();

          if (data.docs && data.docs.length > 0) {
            const books = data.docs.map(item => {
              const title = formatTitle(item.title || 'Başlık Bilgisi Yok');
              const authors = formatAuthor(item.author_name ? item.author_name.join(', ') : 'Yazar Bilgisi Yok');
              const publisher = item.publisher ? item.publisher[0] : 'Yayınevi Bilgisi Yok';
              
              return {
                id: self.crypto.randomUUID(), 
                title: title,
                authors: authors,
                publisher: publisher,
                genre: 'Bilinmiyor', // Arama sonucunda boş gelir, eklerken seçilebilir
                description: '',
                notes: '' 
              };
            });
            setSearchResults(books);
          } else { 
            showMessage('Aradığınız kitap bulunamadı.', 'info'); 
          }
        } catch (err) { 
          showMessage('Kitap arama sırasında bir hata oluştu.', 'error'); 
        } 
        finally { setLoading(false); }
      };

      const addBookToRead = async (book) => {
          if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
          const newBook = { 
            title: formatTitle(book.title), 
            authors: formatAuthor(book.authors), 
            publisher: book.publisher, 
            genre: book.genre || 'Bilinmiyor',
            description: book.description, 
            notes: book.notes,
            readDate: getTodayDate()
          };
          const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
          const querySnapshot = await getDocs(q);
          const exists = querySnapshot.docs.some(doc => doc.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && doc.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'));
          if (exists) return showMessage('Bu kitap zaten okuduklarım listesinde var.', 'error');
          try {
              await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), newBook);
              showMessage('Kitap okuduklarıma başarıyla eklendi!', 'success'); setSearchResults([]); setSearchTerm('');
          } catch (e) { showMessage('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const handleManualAddBook = async (target) => {
        if (!manualBook.title.trim() || !manualBook.authors.trim()) return showMessage('Başlık ve Yazar alanları zorunludur.', 'error');
        const newBook = { 
            title: formatTitle(manualBook.title), 
            authors: formatAuthor(manualBook.authors), 
            publisher: manualBook.publisher || 'Yayınevi Bilgisi Yok', 
            genre: manualBook.genre || 'Bilinmiyor',
            description: manualBook.description || '', 
            notes: manualBook.notes || ''
        };
        
        if (target === 'read') {
            newBook.readDate = manualBook.readDate || '';
        }

        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        const collectionName = target === 'read' ? 'readBooks' : 'libraryBooks';
        const q = query(collection(db, `artifacts/${appId}/users/${userId}/${collectionName}`));
        const querySnapshot = await getDocs(q);
        const exists = querySnapshot.docs.some(doc => doc.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && doc.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'));
        if (exists) return showMessage('Bu kitap zaten listenizde var.', 'error');
        try {
            await addDoc(collection(db, `artifacts/${appId}/users/${userId}/${collectionName}`), newBook);
            showMessage('Kitap başarıyla eklendi!', 'success'); 
            resetManualBookForm(); 
            setManualAddTarget(null);
        } catch (e) { showMessage('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const saveEditedBook = async () => {
        if (!db || !userId || !editingBook) return showMessage('Kaydedilecek veri bulunamadı.', 'error');
        const { id, source, ...bookData } = editingBook;
        
        const formattedBookData = {
            ...bookData,
            title: formatTitle(bookData.title),
            authors: formatAuthor(bookData.authors),
            genre: bookData.genre || 'Bilinmiyor',
            readDate: bookData.readDate || ''
        };

        try {
            const collectionName = source === 'read' ? 'readBooks' : 'libraryBooks';
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/${collectionName}`, id), formattedBookData);
            showMessage('Kitap başarıyla güncellendi!', 'success'); closeEditModal();
        } catch (e) { showMessage('Kitap güncellenirken bir hata oluştu.', 'error'); }
      };

      const removeBook = async (id, from) => {
        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        const collectionName = from === 'read' ? 'readBooks' : 'libraryBooks';
        setConfirmation({
            message: 'Bu kitabı silmek istediğinizden emin misiniz?',
            onConfirm: async () => {
                try { 
                    await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/${collectionName}`, id)); 
                    showMessage('Kitap başarıyla silindi!', 'success'); 
                } catch (e) { 
                    showMessage('Kitap silinirken hata oluştu.', 'error'); 
                }
            },
            danger: true
        });
      };
      
      const markAsRead = async (book) => {
        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        try {
            const { id, source, ...bookData } = book;
            const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
            const querySnapshot = await getDocs(q);
            const exists = querySnapshot.docs.some(doc => doc.data().title.toLocaleLowerCase('tr-TR') === bookData.title.toLocaleLowerCase('tr-TR') && doc.data().authors.toLocaleLowerCase('tr-TR') === bookData.authors.toLocaleLowerCase('tr-TR'));
            if (!exists) {
                await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), {
                    ...bookData,
                    readDate: getTodayDate()
                });
            }
            showMessage(`${book.title} okundu olarak işaretlendi!`, 'success');
        } catch (e) {
            showMessage('İşlem sırasında bir hata oluştu.', 'error');
        }
      };

      const handleLogin = async () => {
        if (!email || !password) return setAuthError('E-posta ve şifre girin.');
        try { await signInWithEmailAndPassword(auth, email, password); } catch (e) { setAuthError('Yanlış e-posta veya şifre.'); }
      };

      const handleRegister = async () => {
        if (!email || !password) return setAuthError('E-posta ve şifre girin.');
        try { await createUserWithEmailAndPassword(auth, email, password); } 
        catch (e) {
            if (e.code === 'auth/weak-password') setAuthError('Şifre en az 6 karakter olmalıdır.');
            else if (e.code === 'auth/email-already-in-use') setAuthError('Bu e-posta zaten kullanımda.');
            else setAuthError('Kayıt olurken bir hata oluştu.');
        }
      };
      
      const handleSignOut = async () => {
        try { await signOut(auth); setReadBooks([]); setLibraryBooks([]); setUserName(''); setUserSurname(''); setEmail(''); setPassword(''); } 
        catch (e) { showMessage('Çıkış yaparken hata oluştu.', 'error'); }
      };

      // Dinamik Sıralama ve Filtreleme
      const sortBooksList = (books, sortBy) => {
        let activeSort = sortBy;
        if (activeSort === 'read' || activeSort === 'unread') {
           activeSort = 'author'; // Filtre olarak kullanıldığında varsayılan sıralama yazar olsun
        }

        return [...books].sort((a, b) => {
          if (activeSort === 'dateDesc') {
            const dateA = a.readDate || '';
            const dateB = b.readDate || '';
            return dateB.localeCompare(dateA); 
          }
          if (activeSort === 'dateAsc') {
            const dateA = a.readDate || '';
            const dateB = b.readDate || '';
            if (!dateA) return 1; 
            if (!dateB) return -1;
            return dateA.localeCompare(dateB); 
          }
          if (activeSort === 'author') return (a.authors || '').localeCompare(b.authors || '');
          if (activeSort === 'title') return (a.title || '').localeCompare(b.title || '');
          if (activeSort === 'publisher') return (a.publisher || '').localeCompare(b.publisher || '');
          return 0;
        });
      };

      const filteredReadBooks = readBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = readBooksGenreFilter === '' || book.genre === readBooksGenreFilter;
          return matchesSearch && matchesGenre;
      });
      const sortedReadBooks = sortBooksList(filteredReadBooks, readBooksSortBy);

      const filteredLibraryBooks = libraryBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = libraryGenreFilter === '' || book.genre === libraryGenreFilter;
          
          // Okunma durumu kontrolü
          const isRead = readBooks.some(rb => rb.title === book.title && rb.authors === book.authors);
          let matchesStatus = true;
          if (librarySortBy === 'read') matchesStatus = isRead;
          if (librarySortBy === 'unread') matchesStatus = !isRead;

          return matchesSearch && matchesGenre && matchesStatus;
      });
      const sortedLibraryBooks = sortBooksList(filteredLibraryBooks, librarySortBy);

      // Kullanıcının gerçekten eklediği türleri filtre dropdown'larında göstermek için:
      const availableReadGenres = Array.from(new Set(readBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort();
      const availableLibraryGenres = Array.from(new Set(libraryBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort();

      // Ortak Kitap Kartı CSS Sınıfı (Grid Uyumlu)
      const bookCardClass = "bg-gradient-to-br from-slate-700 to-slate-800 p-6 pl-8 rounded-r-2xl rounded-l-sm border-[3px] border-white flex flex-col justify-between h-full hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] hover:-translate-y-1.5 transition-all duration-300 group shadow-2xl relative overflow-hidden before:absolute before:top-0 before:bottom-0 before:left-0 before:w-5 before:bg-gradient-to-r before:from-black/40 before:to-transparent before:border-r before:border-black/20 min-h-[260px]";

      if (!isAuthReady) return <div className="min-h-screen flex items-center justify-center text-white text-xl">Yükleniyor...</div>;

        return (

              <p className="text-center mt-4"> <button onClick={() => setIsLoginMode(!isLoginMode)} className="text-blue-400 hover:underline">{isLoginMode ? 'Hesabın yok mu? Kaydol' : 'Zaten hesabın var mı? Giriş yap'}</button> </p>
            </div>
          </div>

                        <div className="flex flex-wrap gap-2 mb-3">
                            {book.genre && book.genre !== 'Bilinmiyor' && <span className="text-[11px] font-bold bg-indigo-900/50 text-indigo-300 px-2.5 py-1 rounded-md border border-indigo-700/50">{book.genre}</span>}
                        </div>
                        {book.publisher && book.publisher !== 'Yayınevi Bilgisi Yok' && (<p className="text-xs text-slate-400 mb-1">Yayınevi: <span className="text-slate-300">{book.publisher}</span></p>)}
                        {book.readDate && (

                      <div className="flex justify-end gap-2 mt-5 pt-4 border-t border-slate-600/50 opacity-80 group-hover:opacity-100 transition-opacity">

                        <button onClick={() => removeBook(book.id, 'read')} className="p-2 rounded-full hover:bg-red-600 bg-slate-800 transition-colors" aria-label="Sil"><svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                      </div>
                    </div>

          {showBackToTop && (<button onClick={scrollToTop} className="fixed bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:bg-blue-500 transition-all z-50 transform hover:-translate-y-1" aria-label="Başa Dön"><svg xmlns="http://www.w3.org/2000/svg" className="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 15l7-7 7 7" /></svg></button>)}
          
          {}
          {showLibrary && (
            <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm flex flex-col z-50 p-4 sm:p-6 md:p-8">

                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <h2 className="text-3xl font-bold text-slate-100 flex items-center gap-3">Kütüphanem <span className="bg-slate-700 text-slate-300 text-lg px-3 py-1 rounded-full">{filteredLibraryBooks.length}</span></h2>
                        <button onClick={() => setShowLibrary(false)} className="text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 w-10 h-10 rounded-full flex items-center justify-center transition-colors">&times;</button>
                    </div>
                    
                    <div className="flex flex-col md:flex-row gap-3 mb-6">
                        <div className="relative flex-grow">
                            <input type="text" className="w-full p-3 pr-10 bg-slate-900 rounded-xl text-white border border-slate-600 focus:border-blue-500 focus:outline-none transition-colors shadow-inner h-full" placeholder="Kütüphanemde kitap veya yazar ara..." value={libraryFilterTerm} onChange={(e) => setLibraryFilterTerm(e.target.value)} />
                            {libraryFilterTerm && <button onClick={() => setLibraryFilterTerm('')} className="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-white">&times;</button>}
                        </div>
                        
                        <select className="bg-slate-900 text-slate-200 border border-slate-600 rounded-xl p-3 text-sm font-medium focus:border-blue-500 outline-none w-full md:w-auto" value={libraryGenreFilter} onChange={(e) => setLibraryGenreFilter(e.target.value)}>
                            <option value="">Tüm Türler</option>
                            {availableLibraryGenres.map(g => <option key={g} value={g}>{g}</option>)}
                        </select>
                        
                        <select className="bg-slate-900 text-slate-200 border border-slate-600 rounded-xl p-3 text-sm font-medium focus:border-blue-500 outline-none w-full md:w-auto" value={librarySortBy} onChange={(e) => setLibrarySortBy(e.target.value)}>
                            <option value="author">Yazar (A-Z)</option>
                            <option value="title">Kitap Adı (A-Z)</option>
                            <option value="publisher">Yayınevi (A-Z)</option>

                            <option value="read">Sadece Okunanlar</option>
                            <option value="unread">Sadece Okunmayanlar</option>

                        <button onClick={() => {resetManualBookForm(); setManualAddTarget('library');}} className="w-full md:w-auto px-5 py-3 bg-indigo-600 hover:bg-indigo-500 transition-colors rounded-xl font-bold shadow-lg whitespace-nowrap">Manuel Ekle</button>

                    <div className="flex-1 overflow-y-auto modal-scroll pr-3">

                            </div>
                        ))}
                        {statsTab === 'genres' && (getGenreStats().length === 0 ? (<div className="flex h-full items-center justify-center"><p className="text-slate-400 text-xl border border-dashed border-slate-600 p-10 rounded-2xl bg-slate-900/50">Tür istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                                {getGenreStats().map(([genreName, data]) => (
                                    <div key={genreName} onClick={() => handleGenreClick(genreName, data.books)} className="bg-slate-700/50 p-6 rounded-xl border border-slate-600 hover:border-indigo-500 hover:bg-slate-700 cursor-pointer transition-all flex flex-col justify-between group shadow-md">
                                        <span className="text-lg font-bold text-slate-100 mb-6 group-hover:text-indigo-400 transition-colors leading-tight">{genreName}</span>
                                        <div className="flex justify-between items-center">
                                            <span className="px-3.5 py-1.5 bg-slate-900 text-indigo-400 text-xs font-bold rounded-lg border border-indigo-900/50">{data.count} Kitap</span>
                                            <svg className="w-6 h-6 text-slate-500 group-hover:text-indigo-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

</body>
</html>
