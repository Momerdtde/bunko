<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Okuduğum Kitaplar</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    /* Metalik Arka Plan */
    body {
    font-family: 'Inter', sans-serif;
    background: #000000;
    background-attachment: fixed;
    color: #ffffff;
    min-height: 100vh;
}
    
    h1, h2, h3.font-montserrat {
        font-family: 'Montserrat', sans-serif;
    }

    /* Neon Başlık Efekti */
    .neon-title {
        color: #ffffff;
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ea5e9, 0 0 40px #0ea5e9;
    }

    /* Pembe Neon Alıntı Efekti */
    .neon-pink {
        color: #f9a8d4;
        text-shadow: 0 0 5px #f9a8d4, 0 0 10px #f472b6, 0 0 20px #ec4899, 0 0 40px #be185d;
    }

    /* Cam / Metalik Panel Efekti */
    .glass-panel {
        background: rgba(15, 15, 15, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    /* Siyah Butonlar */
    .btn-black {
        background-color: #000000;
        color: #ffffff;
        border: 1px solid #333333;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.4);
        transition: all 0.3s ease;
    }
    .btn-black:hover:not(:disabled) {
        background-color: #111111;
        border-color: #0ea5e9; 
        box-shadow: 0 0 12px rgba(14, 165, 233, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        transform: translateY(-2px);
    }
    .btn-black:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Kitap Kapağı Görünümlü Kartlar - Kalın Beyaz Çerçeve */
    .book-cover-card {
        background: linear-gradient(145deg, #1f2937, #000000);
        border: 3px solid #ffffff; 
        border-radius: 2px 12px 12px 2px; 
        box-shadow: 5px 5px 15px rgba(0,0,0,0.7), inset -2px 0 5px rgba(255,255,255,0.1);
        position: relative;
    }
    
    /* Kitap Cilt/Sırt Efekti (Spine) */
    .book-spine::before {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0;
        width: 14px;
        background: linear-gradient(to right, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.6) 100%);
        border-right: 1px solid rgba(0,0,0,0.8);
        border-top-left-radius: 1px;
        border-bottom-left-radius: 1px;
        z-index: 5;
    }

    /* Girdi Kutuları */
    .input-dark {
        background-color: rgba(0,0,0,0.6);
        border: 1px solid #4b5563;
        color: #ffffff;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-dark:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 8px rgba(14, 165, 233, 0.4);
        outline: none;
    }

    /* Kaydırma çubuğu stilleri */
    .modal-scroll::-webkit-scrollbar { width: 8px; }
    .modal-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
    .modal-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    .modal-scroll::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
      authDomain: "okudugumkitaplarapp.firebaseapp.com",
      projectId: "okudugumkitaplarapp",
      storageBucket: "okudugumkitaplarapp.firebasestorage.app",
      messagingSenderId: "292934565697",
      appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
      measurementId: "G-V0EFGVV2CR"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = firebaseConfig.projectId;

    const PREDEFINED_GENRES = [
        "Anı", "Antoloji", "Araştırma", "Bilim Kurgu", "Biyografi", "Çizgi Roman", "Çocuk Kitabı",
        "Deneme", "Derleme", "Din / Tasavvuf", "Fantastik", "Felsefe", 
        "Gezi Yazısı", "Günlük", "Hatıra", "Hikâye", "Kişisel Gelişim", "Makale", "Mülakat",
        "Otobiyografi", "Psikoloji", "Roman", "Röportaj", "Siyaset", "Sohbet",
        "Söyleşi", "Sözlük", "Şiir", "Tarih", "Tiyatro", "Diğer"
    ];

    const generateId = () => Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);

    const { useState, useEffect } = React;

    function App() {
      const [userId, setUserId] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      
      const [searchTerm, setSearchTerm] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [readBooks, setReadBooks] = useState([]);
      const [libraryBooks, setLibraryBooks] = useState([]);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null); 
      
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false); 
      const [showLibrary, setShowLibrary] = useState(false); 
      const [userName, setUserName] = useState('');
      const [userSurname, setUserSurname] = useState('');
      
      const [readBooksFilterTerm, setReadBooksFilterTerm] = useState('');
      const [readBooksGenreFilter, setReadBooksGenreFilter] = useState(''); 
      const [readBooksSortBy, setReadBooksSortBy] = useState('dateDesc'); 
      
      const [libraryFilterTerm, setLibraryFilterTerm] = useState('');
      const [libraryGenreFilter, setLibraryGenreFilter] = useState(''); 
      const [librarySortBy, setLibrarySortBy] = useState('author'); 
      
      const [editingBook, setEditingBook] = useState(null);
      const [plainTextImportList, setPlainTextImportList] = useState('');
      const [manualAddTarget, setManualAddTarget] = useState(null); 
      const [manualBook, setManualBook] = useState({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: '' });
      
      const [selectedAuthorBooks, setSelectedAuthorBooks] = useState([]);
      const [selectedAuthorName, setSelectedAuthorName] = useState('');
      const [selectedPublisherBooks, setSelectedPublisherBooks] = useState([]);
      const [selectedPublisherName, setSelectedPublisherName] = useState('');
      const [selectedGenreBooks, setSelectedGenreBooks] = useState([]); 
      const [selectedGenreName, setSelectedGenreName] = useState(''); 
      const [selectedBookDetails, setSelectedBookDetails] = useState(null);
      
      const [statsSearchTerm, setStatsSearchTerm] = useState('');
      const [statsTab, setStatsTab] = useState('authors'); 
      const [showBackToTop, setShowBackToTop] = useState(false);
      const [confirmation, setConfirmation] = useState(null);

      const getTodayDate = () => {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      };

      const formatDisplayDate = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
        return dateString;
      };

      useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      const formatTitle = (title) => {
        if (!title) return '';
        return title.toLocaleLowerCase('tr-TR').split(' ').map(word => word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1)).join(' ');
      };

      const formatAuthor = (author) => {
        if (!author) return '';
        const lowerCaseAuthor = author.toLocaleLowerCase('tr-TR').trim();
        const omerSeyfettinVariations = ['ömer seyfettin', 'omer seyfettin', 'ö. seyfettin', 'o. seyfettin', 'ö.seyfettin', 'o.seyfettin', 'ö. seyfetin', 'o. seyfetin'];
        if (omerSeyfettinVariations.includes(lowerCaseAuthor)) return 'Ömer Seyfettin';
        const halidZiyaVariations = ['halid ziya', 'halit ziya', 'hâlid ziya', 'halid ziya uşaklıgil', 'halit ziya uşaklıgil', 'hâlid ziya uşaklıgil'];
        if (halidZiyaVariations.includes(lowerCaseAuthor)) return 'Halid Ziya Uşaklıgil';
        
        return lowerCaseAuthor.split(' ').map(word => {
          if (!word) return '';
          return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1);
        }).join(' ');
      };
      
      const getStats = (type) => {
        const stats = {};
        readBooks.forEach(book => {
            let keys = [];
            if (type === 'authors') {
                keys = book.authors ? book.authors.split(',').map(a => formatAuthor(a.trim())).filter(a => a) : [];
            } else if (type === 'publishers') {
                const pub = book.publisher || "Bilinmiyor";
                if(pub !== "Yayınevi Bilgisi Yok" && pub !== "Bilinmiyor") keys.push(pub);
            } else if (type === 'genres') {
                const gen = book.genre || "Bilinmiyor";
                if(gen !== "Bilinmiyor") keys.push(gen);
            }
            
            keys.forEach(key => {
                if (!stats[key]) stats[key] = { count: 0, books: [] };
                stats[key].count++;
                stats[key].books.push(book);
            });
        });
        
        let sorted = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) sorted = sorted.filter(([name]) => name.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR')));
        return sorted;
      };

      const handleBookClickInStats = (bookTitle) => {
        const book = readBooks.find(b => b.title === bookTitle);
        if(book) setSelectedBookDetails(book);
      };

      const openEditModal = (book, source) => setEditingBook({ ...book, source });
      const closeEditModal = () => setEditingBook(null);
      const showMessageText = (content, type) => {
        setMessage({ content, type });
        setTimeout(() => setMessage(null), 4000);
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(user => {
            setUserId(user ? user.uid : null);
            setIsAuthReady(true);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!isAuthReady || !userId) return;
        
        const booksUnsubscribe = db.collection(`artifacts/${appId}/users/${userId}/readBooks`).onSnapshot(snapshot => {
          setReadBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const libraryUnsubscribe = db.collection(`artifacts/${appId}/users/${userId}/libraryBooks`).onSnapshot(snapshot => {
          setLibraryBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const profileUnsubscribe = db.doc(`artifacts/${appId}/users/${userId}/profile/info`).onSnapshot(docSnap => {
          if (docSnap.exists) {
            setUserName(docSnap.data().userName || '');
            setUserSurname(docSnap.data().userSurname || '');
          }
        });
        
        return () => { booksUnsubscribe(); libraryUnsubscribe(); profileUnsubscribe(); };
      }, [isAuthReady, userId]);
      
      const saveUserProfile = async () => {
        try {
          await db.doc(`artifacts/${appId}/users/${userId}/profile/info`).set({ userName, userSurname }, { merge: true });
          showMessageText('Profil bilgileri kaydedildi!', 'success');
        } catch (e) { showMessageText("Profil kaydedilirken hata oluştu.", "error"); }
      };

      const exportData = () => {
        if (readBooks.length === 0) return showMessageText('Dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = readBooks.map(b => `${b.title} - ${b.authors} | Tür: ${b.genre || '-'} ${b.readDate ? `(Okuma: ${formatDisplayDate(b.readDate)})` : ''}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'okudugum_kitaplar.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        showMessageText('Veri başarıyla dışa aktarıldı!', 'success');
      };
      
      const exportLibraryData = () => {
        if (libraryBooks.length === 0) return showMessageText('Kütüphanede dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = libraryBooks.map(b => `${b.title} - ${b.authors} | Tür: ${b.genre || '-'}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'kutuphanem.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        showMessageText('Kütüphane verisi başarıyla dışa aktarıldı!', 'success');
      };

      const handlePlainTextImport = async () => {
        if (!plainTextImportList.trim() || !userId) return showMessageText('Liste boş.', 'error');
        const lines = plainTextImportList.split('\n').filter(line => line.trim().length > 0);
        const existingBooks = new Set([...readBooks, ...libraryBooks].map(b => `${b.title.toLocaleLowerCase('tr-TR')}-${b.authors.toLocaleLowerCase('tr-TR')}`));
        const newBooksToAdd = [];
        lines.forEach(line => {
            let title = line.trim(), authors = 'Bilinmiyor';
            const separatorMatch = line.match(/(.*)\s*[-–—]\s*(.*)$/);
            if (separatorMatch) { [ ,title, authors] = separatorMatch.map(s => s.trim()); }
            const fTitle = formatTitle(title), fAuthors = formatAuthor(authors);
            const bookKey = `${fTitle.toLocaleLowerCase('tr-TR')}-${fAuthors.toLocaleLowerCase('tr-TR')}`;
            if (!existingBooks.has(bookKey)) {
                newBooksToAdd.push({ title: fTitle, authors: fAuthors, publisher: '', genre: 'Bilinmiyor', notes: '', readDate: '' }); 
                existingBooks.add(bookKey);
            }
        });
        if (newBooksToAdd.length === 0) return showMessageText('Yeni kitap bulunamadı.', 'info');
        try {
            const batch = db.batch();
            newBooksToAdd.forEach(book => {
                const newDocRef = db.collection(`artifacts/${appId}/users/${userId}/readBooks`).doc();
                batch.set(newDocRef, book);
            });
            await batch.commit();
            showMessageText(`${newBooksToAdd.length} kitap başarıyla eklendi!`, 'success');
            setPlainTextImportList(''); setShowSettings(false);
        } catch (e) { showMessageText('İçe aktarılırken hata oluştu.', 'error'); }
      };

      const searchBooks = async () => {
        if (!searchTerm.trim()) return showMessageText('Arama terimi girin.', 'error');
        setLoading(true); setSearchResults([]);
        try {
          const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchTerm)}&limit=10`);
          const data = await res.json();
          if (data.docs && data.docs.length > 0) {
            const books = data.docs.map(item => ({
                id: generateId(), 
                title: formatTitle(item.title || 'Başlık Bilgisi Yok'),
                authors: formatAuthor(item.author_name ? item.author_name.join(', ') : 'Yazar Bilgisi Yok'),
                publisher: item.publisher ? item.publisher[0] : 'Yayınevi Bilgisi Yok',
                genre: 'Bilinmiyor',
                description: '', notes: '' 
            }));
            setSearchResults(books);
          } else { showMessageText('Aradığınız kitap bulunamadı.', 'info'); }
        } catch (err) { showMessageText('Arama sırasında hata oluştu.', 'error'); } 
        finally { setLoading(false); }
      };

      const addBookToRead = async (book) => {
          const newBook = { 
            title: formatTitle(book.title), authors: formatAuthor(book.authors), 
            publisher: book.publisher, genre: book.genre || 'Bilinmiyor',
            description: book.description, notes: book.notes, readDate: getTodayDate()
          };
          const snap = await db.collection(`artifacts/${appId}/users/${userId}/readBooks`).get();
          if (snap.docs.some(d => d.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && d.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'))) {
              return showMessageText('Bu kitap zaten listenizde var.', 'error');
          }
          try {
              await db.collection(`artifacts/${appId}/users/${userId}/readBooks`).add(newBook);
              showMessageText('Kitap başarıyla eklendi!', 'success'); setSearchResults([]); setSearchTerm('');
          } catch (e) { showMessageText('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const handleManualAddBook = async (target) => {
        if (!manualBook.title.trim() || !manualBook.authors.trim()) return showMessageText('Başlık ve Yazar zorunludur.', 'error');
        const newBook = { 
            title: formatTitle(manualBook.title), authors: formatAuthor(manualBook.authors), 
            publisher: manualBook.publisher || 'Yayınevi Bilgisi Yok', genre: manualBook.genre || 'Bilinmiyor',
            description: manualBook.description || '', notes: manualBook.notes || ''
        };
        if (target === 'read') newBook.readDate = manualBook.readDate || '';

        const colName = target === 'read' ? 'readBooks' : 'libraryBooks';
        const snap = await db.collection(`artifacts/${appId}/users/${userId}/${colName}`).get();
        if (snap.docs.some(d => d.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && d.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'))) {
            return showMessageText('Bu kitap zaten listenizde var.', 'error');
        }
        try {
            await db.collection(`artifacts/${appId}/users/${userId}/${colName}`).add(newBook);
            showMessageText('Kitap başarıyla eklendi!', 'success'); 
            setManualBook({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: getTodayDate() }); 
            setManualAddTarget(null);
        } catch (e) { showMessageText('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const saveEditedBook = async () => {
        const { id, source, ...bookData } = editingBook;
        const formatted = {
            ...bookData, title: formatTitle(bookData.title), authors: formatAuthor(bookData.authors),
            genre: bookData.genre || 'Bilinmiyor', readDate: bookData.readDate || ''
        };
        try {
            const colName = source === 'read' ? 'readBooks' : 'libraryBooks';
            await db.doc(`artifacts/${appId}/users/${userId}/${colName}/${id}`).set(formatted);
            showMessageText('Kitap güncellendi!', 'success'); setEditingBook(null);
        } catch (e) { showMessageText('Güncellenirken hata oluştu.', 'error'); }
      };

      const removeBook = async (id, from) => {
        const colName = from === 'read' ? 'readBooks' : 'libraryBooks';
        setConfirmation({
            message: 'Bu kitabı silmek istediğinizden emin misiniz?',
            danger: true,
            onConfirm: async () => {
                try { 
                    await db.doc(`artifacts/${appId}/users/${userId}/${colName}/${id}`).delete();
                    showMessageText('Kitap silindi!', 'success'); 
                } catch (e) { showMessageText('Silinirken hata oluştu.', 'error'); }
            }
        });
      };
      
      const markAsRead = async (book) => {
        const { id, source, ...bookData } = book;
        const snap = await db.collection(`artifacts/${appId}/users/${userId}/readBooks`).get();
        if (!snap.docs.some(d => d.data().title.toLocaleLowerCase('tr-TR') === bookData.title.toLocaleLowerCase('tr-TR') && d.data().authors.toLocaleLowerCase('tr-TR') === bookData.authors.toLocaleLowerCase('tr-TR'))) {
            await db.collection(`artifacts/${appId}/users/${userId}/readBooks`).add({ ...bookData, readDate: getTodayDate() });
        }
        showMessageText(`${book.title} okundu olarak işaretlendi!`, 'success');
      };

      const handleLogin = async () => { try { await auth.signInWithEmailAndPassword(email, password); } catch(e) { setAuthError('Hatalı giriş.'); } };
      const handleRegister = async () => { try { await auth.createUserWithEmailAndPassword(email, password); } catch(e) { setAuthError('Kayıt başarısız.'); } };
      const handleSignOut = async () => { try { await auth.signOut(); setReadBooks([]); setLibraryBooks([]); } catch(e){} };

      const sortBooksList = (books, sortBy) => {
        let activeSort = sortBy;
        if (activeSort === 'onlyRead' || activeSort === 'onlyUnread') activeSort = 'author'; 
        return [...books].sort((a, b) => {
          if (activeSort === 'dateDesc') {
            const dA = a.readDate || ''; const dB = b.readDate || '';
            if (dA === dB) return 0; if (!dA) return 1; if (!dB) return -1;
            return dB.localeCompare(dA); 
          }
          if (activeSort === 'dateAsc') {
            const dA = a.readDate || ''; const dB = b.readDate || '';
            if (!dA) return 1; if (!dB) return -1;
            return dA.localeCompare(dB); 
          }
          if (activeSort === 'author') return (a.authors || '').localeCompare(b.authors || '');
          if (activeSort === 'title') return (a.title || '').localeCompare(b.title || '');
          if (activeSort === 'publisher') return (a.publisher || '').localeCompare(b.publisher || '');
          if (activeSort === 'genre') return (a.genre || '').localeCompare(b.genre || '');
          return 0;
        });
      };

      const filteredReadBooks = readBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = readBooksGenreFilter === '' || book.genre === readBooksGenreFilter;
          return matchesSearch && matchesGenre;
      });
      const sortedReadBooks = sortBooksList(filteredReadBooks, readBooksSortBy);

      const filteredLibraryBooks = libraryBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = libraryGenreFilter === '' || book.genre === libraryGenreFilter;
          
          const isRead = readBooks.some(rb => rb.title === book.title && rb.authors === book.authors);
          let matchesStatus = true;
          if (librarySortBy === 'onlyRead') matchesStatus = isRead;

                <div className="space-y-5">
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Başlık:</label>
                      <input type="text" className="input-dark w-full p-3.5 rounded-xl" value={editingBook.title} onChange={(e) => setEditingBook({...editingBook, title: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Yazar:</label>
                      <input type="text" className="input-dark w-full p-3.5 rounded-xl" value={editingBook.authors} onChange={(e) => setEditingBook({...editingBook, authors: e.target.value})} />
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2 text-gray-300">Tür:</label>
                        <select className="input-dark w-full p-3.5 rounded-xl appearance-none" value={editingBook.genre || 'Bilinmiyor'} onChange={(e) => setEditingBook({...editingBook, genre: e.target.value})}>
                            <option value="Bilinmiyor">Tür Seçiniz...</option>
                            {PREDEFINED_GENRES.map(g => <option key={g} value={g}>{g}</option>)}
                        </select>
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Yayınevi:</label>
                      <input type="text" className="input-dark w-full p-3.5 rounded-xl" value={editingBook.publisher} onChange={(e) => setEditingBook({...editingBook, publisher: e.target.value})} />
                    </div>
                    {editingBook.source === 'read' && (
                      <div>
                        <label className="block text-sm font-semibold mb-2 text-gray-300">Okuma Tarihi:</label>
                        <input type="date" className="input-dark w-full p-3.5 rounded-xl" value={editingBook.readDate || ''} onChange={(e) => setEditingBook({...editingBook, readDate: e.target.value})} />
                      </div>
                    )}
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Notlar:</label>
                      <textarea className="input-dark w-full p-4 rounded-xl min-h-[120px]" value={editingBook.notes || ''} onChange={(e) => setEditingBook({...editingBook, notes: e.target.value})}></textarea>
                    </div>
                    <button onClick={saveEditedBook} className="btn-black w-full py-4 rounded-xl font-bold border-sky-800 text-sky-400 mt-4">Değişiklikleri Kaydet</button>
                </div>
              </div>
            </div>
          )}
          
          {manualAddTarget !== null && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-lg relative max-h-[90vh] overflow-y-auto modal-scroll pr-3 border-t border-gray-600">
                <button onClick={() => { setManualAddTarget(null); setManualBook({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: '' }); }} className="btn-black absolute top-5 right-5 w-10 h-10 rounded-full flex items-center justify-center text-2xl pb-1 hover:text-rose-400">&times;</button>
                <h2 className="text-3xl font-bold mb-8 text-center text-white neon-title">
                    {manualAddTarget === 'read' ? 'Okuduğum Kitap Ekle' : 'Kütüphaneye Ekle'}
                </h2>
                <div className="space-y-5">
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Başlık *</label>
                      <input type="text" className="input-dark w-full p-3.5 rounded-xl" value={manualBook.title} onChange={(e) => setManualBook({ ...manualBook, title: e.target.value })} />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Yazar *</label>
                      <input type="text" className="input-dark w-full p-3.5 rounded-xl" value={manualBook.authors} onChange={(e) => setManualBook({ ...manualBook, authors: e.target.value })} />
                    </div>
                    <div>
                        <label className="block text-sm font-semibold mb-2 text-gray-300">Tür:</label>
                        <select className="input-dark w-full p-3.5 rounded-xl appearance-none" value={manualBook.genre} onChange={(e) => setManualBook({ ...manualBook, genre: e.target.value })}>
                            <option value="Bilinmiyor">Tür Seçiniz...</option>
                            {PREDEFINED_GENRES.map(g => <option key={g} value={g}>{g}</option>)}
                        </select>
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Yayınevi:</label>
                      <input type="text" className="input-dark w-full p-3.5 rounded-xl" value={manualBook.publisher} onChange={(e) => setManualBook({ ...manualBook, publisher: e.target.value })} />
                    </div>
                    {manualAddTarget === 'read' && (
                      <div>
                        <label className="block text-sm font-semibold mb-2 text-gray-300">Okuma Tarihi:</label>
                        <input type="date" className="input-dark w-full p-3.5 rounded-xl" value={manualBook.readDate || ''} onChange={(e) => setManualBook({ ...manualBook, readDate: e.target.value })} />
                      </div>
                    )}
                    <div>
                      <label className="block text-sm font-semibold mb-2 text-gray-300">Notlar:</label>
                      <textarea className="input-dark w-full p-4 rounded-xl min-h-[120px]" value={manualBook.notes} onChange={(e) => setManualBook({ ...manualBook, notes: e.target.value})}></textarea>
                    </div>
                    <button onClick={() => handleManualAddBook(manualAddTarget)} className="btn-black w-full py-4 rounded-xl font-bold border-indigo-800 text-indigo-400 mt-4">Kaydet ve Ekle</button>
                </div>
              </div>
            </div>
          )}
          
          {}
          {showStats && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex flex-col z-50 p-4 sm:p-6 lg:p-10">
              <div className="glass-panel p-6 sm:p-10 rounded-3xl shadow-2xl flex-1 flex flex-col min-h-0 w-full max-w-7xl mx-auto border-t border-gray-600">
                
                <div className="flex justify-between items-center mb-6 border-b border-gray-700/50 pb-5">
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-white neon-title">İstatistikler</h2>
                  <button onClick={() => { setShowStats(false); setSelectedAuthorName(''); setSelectedPublisherName(''); setSelectedGenreName(''); setStatsSearchTerm(''); setSelectedBookDetails(null); }} className="btn-black w-12 h-12 rounded-full flex items-center justify-center text-2xl pb-1 hover:text-rose-400">&times;</button>
                </div>
                
                {selectedBookDetails ? (
                  <div className="flex-1 flex flex-col min-h-0 items-center justify-center relative">
                    <button onClick={() => setSelectedBookDetails(null)} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div className="w-full max-w-2xl">
                        <h3 className="text-3xl font-bold mb-8 text-white pr-16 border-b border-gray-700/50 pb-4">Eser Detayları</h3>
                        <div className="book-cover-card p-8 pl-10 flex flex-col book-spine min-h-[300px]">
                            <div className="z-10 relative">
                                <h3 className="text-3xl font-extrabold text-white mb-4 leading-tight drop-shadow-lg">{selectedBookDetails.title}</h3>
                                <p className="text-xl font-bold text-sky-400 mb-6 drop-shadow">{selectedBookDetails.authors}</p>
                                <div className="grid grid-cols-2 gap-6 bg-black/40 p-6 rounded-xl border border-gray-700/50">
                                    <div>
                                        <p className="text-xs text-gray-500 uppercase font-bold tracking-wider mb-1">Tür</p>
                                        <p className="text-lg text-gray-200 font-medium">{selectedBookDetails.genre || '-'}</p>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 uppercase font-bold tracking-wider mb-1">Yayınevi</p>
                                        <p className="text-lg text-gray-200 font-medium">{selectedBookDetails.publisher && selectedBookDetails.publisher !== 'Yayınevi Bilgisi Yok' ? selectedBookDetails.publisher : '-'}</p>
                                    </div>
                                    <div className="col-span-2 pt-4 border-t border-gray-700/50">
                                        <p className="text-xs text-gray-500 uppercase font-bold tracking-wider mb-2">Okuma Tarihi</p>
                                        <p className="text-lg text-emerald-400 font-bold flex items-center gap-2">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                            {selectedBookDetails.readDate ? formatDisplayDate(selectedBookDetails.readDate) : 'Tarih Belirtilmemiş'}
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <div className="mt-8 pt-6 border-t border-gray-700/50 flex justify-end z-10 relative">
                                <button onClick={() => { openEditModal(selectedBookDetails, 'read'); setShowStats(false); }} className="btn-black px-8 py-3 rounded-xl font-bold border-sky-800 text-sky-400 flex items-center gap-2">
                                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                  Bilgileri Düzenle
                                </button>
                            </div>
                        </div>
                    </div>
                  </div>
                ) : selectedAuthorName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-gray-700/50 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedAuthorName} 
                            <span className="bg-sky-500/20 text-sky-400 text-lg px-4 py-1 rounded-full border border-sky-500/30">{selectedAuthorBooks.length} Eser</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedAuthorName(''); setSelectedAuthorBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedAuthorBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-gray-700 cursor-pointer hover:border-sky-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-sky-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : selectedPublisherName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-gray-700/50 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedPublisherName} 
                            <span className="bg-sky-500/20 text-sky-400 text-lg px-4 py-1 rounded-full border border-sky-500/30">{selectedPublisherBooks.length} Eser</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedPublisherName(''); setSelectedPublisherBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedPublisherBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-gray-700 cursor-pointer hover:border-sky-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-sky-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : selectedGenreName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-gray-700/50 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedGenreName} 
                            <span className="bg-sky-500/20 text-sky-400 text-lg px-4 py-1 rounded-full border border-sky-500/30">{selectedGenreBooks.length} Eser</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedGenreName(''); setSelectedGenreBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedGenreBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-gray-700 cursor-pointer hover:border-sky-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-sky-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="border-b border-gray-700/50 mb-8">
                      <nav className="-mb-px flex gap-2 sm:gap-6 overflow-x-auto pb-2">
                        <button onClick={() => setStatsTab('authors')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'authors' ? 'border-sky-500 text-sky-400 bg-sky-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Yazarlar</button>
                        <button onClick={() => setStatsTab('publishers')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'publishers' ? 'border-sky-500 text-sky-400 bg-sky-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Yayınevleri</button>
                        <button onClick={() => setStatsTab('genres')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'genres' ? 'border-sky-500 text-sky-400 bg-sky-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Türler</button>
                      </nav>
                    </div>
                    <div className="flex-1 flex flex-col min-h-0">
                      <div className="relative mb-8">
                        <input type="text" placeholder={`${statsTab === 'authors' ? 'Yazar' : statsTab === 'publishers' ? 'Yayınevi' : 'Tür'} ara...`} className="input-dark w-full p-4 pr-12 rounded-xl text-lg" value={statsSearchTerm} onChange={(e) => setStatsSearchTerm(e.target.value)} />
                        {statsSearchTerm && <button onClick={() => setStatsSearchTerm('')} className="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-white text-xl">&times;</button>}
                      </div>
                      <div className="flex-1 overflow-y-auto modal-scroll pr-3">
                        {statsTab === 'authors' && (getStats('authors').length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-gray-700"><p className="text-gray-400 text-xl font-medium">Yazar istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getStats('authors').map(([authorName, data]) => (
                                    <div key={authorName} onClick={() => handleAuthorClick(authorName, data.books)} className="bg-black/40 p-6 rounded-2xl border border-gray-700 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{authorName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'publishers' && (getStats('publishers').length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-gray-700"><p className="text-gray-400 text-xl font-medium">Yayınevi istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getStats('publishers').map(([publisherName, data]) => (
                                    <div key={publisherName} onClick={() => handlePublisherClick(publisherName, data.books)} className="bg-black/40 p-6 rounded-2xl border border-gray-700 hover:border-sky-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-sky-400 transition-colors leading-tight">{publisherName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-sky-900/30 text-sky-400 text-sm font-bold rounded-lg border border-sky-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-sky-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'genres' && (getStats('genres').length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-gray-700"><p className="text-gray-400 text-xl font-medium">Tür istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getStats('genres').map(([genreName, data]) => (
                                    <div key={genreName} onClick={() => {setSelectedGenreName(genreName); setSelectedGenreBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-gray-700 hover:border-purple-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-purple-400 transition-colors leading-tight">{genreName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-purple-900/30 text-purple-400 text-sm font-bold rounded-lg border border-purple-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-purple-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

</body>
</html>
