<body>

  <div id="root"></div>

  <!-- Firebase JS modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
    };
  </script>

  <!-- React component script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const PREDEFINED_GENRES = [
        "Anı", "Antoloji", "Araştırma", "Bilim Kurgu", "Biyografi", "Çizgi Roman", "Çocuk Kitabı",
        "Deneme", "Derleme", "Din / Tasavvuf", "Fantastik", "Felsefe", 
        "Gezi Yazısı", "Günlük", "Hatıra", "Hikâye", "Kişisel Gelişim", "Makale", "Mülakat",
        "Otobiyografi", "Psikoloji", "Roman", "Röportaj", "Siyaset", "Sohbet",
        "Söyleşi", "Sözlük", "Şiir", "Tarih", "Tiyatro", "Diğer"
    ];

    const generateId = () => {
        return typeof self.crypto !== 'undefined' && self.crypto.randomUUID 
            ? self.crypto.randomUUID() 
            : Math.random().toString(36).substring(2, 15);
    };

    function BunkoLogo({ size = "w-28 h-28" }) {

      return (

          ) : (

              <g stroke="#0D383C" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">

                <path d="M81 105 L107 91" stroke="#0D383C" strokeWidth="1.8" />

              </g>
              <g stroke="#0D383C" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                <path d="M29 60 L66 43 L110 62 L75 82 Z" fill="#1C777B" />
                <path d="M29 60 C25 65, 25 72, 29 76 L75 97 L75 82 L29 60 Z" fill="#25898D" />
                <path d="M75 82 L110 62 C108 67, 108 73, 110 77 L75 97 L75 82 Z" fill="#FDF8E4" />
                <path d="M80 85 L105 71" stroke="#0D383C" strokeWidth="1.8" />
                <path d="M80 90 L103 77" stroke="#0D383C" strokeWidth="1.8" />
                <polygon points="34,66 53,75 53,84 34,75" fill="#FDFBF7" stroke="#0D383C" strokeWidth="2" />
              </g>
              <text x="43.5" y="77.5" fill="#0D383C" fontSize="8.5" fontWeight="bold" textAnchor="middle" transform="skewY(24)">文庫</text>
              <g stroke="#0D383C" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M52 52 C52 37, 74 33, 84 43 C92 51, 88 63, 74 64 C63 65, 53 60, 52 52 Z" fill="#FFFDF9" />
                <path d="M72 56 C70 48, 78 45, 81 51 C84 57, 75 64, 67 62" fill="none" />
                <path d="M58 59 C62 62, 68 62, 69 58" fill="#FFFDF9" />
                <path d="M43 44 C41 37, 47 32, 55 33 C63 34, 68 41, 66 49 C64 56, 54 58, 47 54 C43 52, 43 47, 43 44 Z" fill="#FFFDF9" />
                <path d="M43 43 L40 31 L49 35 C52 34, 55 34, 57 35 C54 42, 48 45, 43 43 Z" fill="#E3A87B" />
                <path d="M56 34 L62 27 L65 39" fill="#FFFDF9" />
                <path d="M58 34 L61 30 L63 37" fill="#E3A87B" stroke="none" />
                <path d="M46 47 C48 49, 50 49, 51 47" fill="none" strokeWidth="2" />
                <path d="M56 47 C58 49, 60 49, 61 47" fill="none" strokeWidth="2" />
                <path d="M52 51 L54 51 L53 52.5 Z" fill="#0D383C" stroke="none" />
                <path d="M51 53.5 C52.5 54.5, 53.5 54.5, 55 53.5" fill="none" strokeWidth="1.8" />
              </g>
            </svg>
          )}
        </div>
      );
    }

    function App() {
      const { 
          initializeApp, 
          getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
          getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
      } = window.firebaseAPI;

      const firebaseConfig = {
        apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
        authDomain: "okudugumkitaplarapp.firebaseapp.com",
        projectId: "okudugumkitaplarapp",
        storageBucket: "okudugumkitaplarapp.firebasestorage.app",
        messagingSenderId: "292934565697",
        appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
        measurementId: "G-V0EFGVV2CR"
      };
      const appId = firebaseConfig.projectId;

      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [userId, setUserId] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      
      const [searchTerm, setSearchTerm] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [readBooks, setReadBooks] = useState([]);
      const [libraryBooks, setLibraryBooks] = useState([]);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null); 
      
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false); 
      const [showLibrary, setShowLibrary] = useState(false); 
      const [userName, setUserName] = useState('');
      const [userSurname, setUserSurname] = useState('');
      const [customGenres, setCustomGenres] = useState([]);
      const [newGenreInput, setNewGenreInput] = useState('');
      
      const [readBooksFilterTerm, setReadBooksFilterTerm] = useState('');
      const [readBooksGenreFilter, setReadBooksGenreFilter] = useState(''); 
      const [readBooksSortBy, setReadBooksSortBy] = useState('dateDesc'); 
      
      const [libraryFilterTerm, setLibraryFilterTerm] = useState('');
      const [libraryGenreFilter, setLibraryGenreFilter] = useState(''); 
      const [librarySortBy, setLibrarySortBy] = useState('author'); 
      
      const [editingBook, setEditingBook] = useState(null);
      const [plainTextImportList, setPlainTextImportList] = useState('');
      const [manualAddTarget, setManualAddTarget] = useState(null); 
      const [manualBook, setManualBook] = useState({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: '' });
      
      const [selectedAuthorBooks, setSelectedAuthorBooks] = useState([]);
      const [selectedAuthorName, setSelectedAuthorName] = useState('');
      const [selectedPublisherBooks, setSelectedPublisherBooks] = useState([]);
      const [selectedPublisherName, setSelectedPublisherName] = useState('');
      const [selectedGenreBooks, setSelectedGenreBooks] = useState([]); 
      const [selectedGenreName, setSelectedGenreName] = useState(''); 
      const [selectedBookDetails, setSelectedBookDetails] = useState(null);
      
      const [statsSearchTerm, setStatsSearchTerm] = useState('');
      const [statsTab, setStatsTab] = useState('authors'); 
      const [showBackToTop, setShowBackToTop] = useState(false);
      const [confirmation, setConfirmation] = useState(null);

      const getTodayDate = () => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const formatDisplayDate = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) {
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }
        return dateString;
      };

      useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const formatTitle = (title) => {
        if (!title) return '';
        return title.toLocaleLowerCase('tr-TR').split(' ').map(word => word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1)).join(' ');
      };

      const formatAuthor = (author) => {
        if (!author) return '';
        const lowerCaseAuthor = author.toLocaleLowerCase('tr-TR').trim();
        const omerSeyfettinVariations = ['ömer seyfettin', 'omer seyfettin', 'ö. seyfettin', 'o. seyfettin', 'ö.seyfettin', 'o.seyfettin', 'ö. seyfetin', 'o. seyfetin'];
        if (omerSeyfettinVariations.includes(lowerCaseAuthor)) return 'Ömer Seyfettin';
        const halidZiyaVariations = ['halid ziya', 'halit ziya', 'hâlid ziya', 'halid ziya uşaklıgil', 'halit ziya uşaklıgil', 'hâlid ziya uşaklıgil'];
        if (halidZiyaVariations.includes(lowerCaseAuthor)) return 'Halid Ziya Uşaklıgil';
        
        return lowerCaseAuthor.split(' ').map(word => {
          if (!word) return '';
          return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1);
        }).join(' ');
      };

      const allGenres = Array.from(new Set([...PREDEFINED_GENRES, ...customGenres])).sort((a, b) => {
        if (a === 'Diğer') return 1;
        if (b === 'Diğer') return -1;
        return a.localeCompare(b, 'tr-TR');
      });

      const savedPublishers = Array.from(new Set(
        [...readBooks, ...libraryBooks]
          .map(b => (b.publisher || '').trim())
          .filter(p => p && p !== 'Yayınevi Bilgisi Yok' && p !== 'Bilinmiyor')
      )).sort((a, b) => a.localeCompare(b, 'tr-TR'));
      
      const getAuthorStats = () => {
        const stats = {};
        readBooks.forEach(book => {
          const authors = book.authors ? book.authors.split(',').map(a => a.trim()).filter(a => a.length > 0) : [];
          authors.forEach(author => {
            const stdAuthor = formatAuthor(author);
            if (!stats[stdAuthor]) stats[stdAuthor] = { count: 0, books: [] };
            stats[stdAuthor].count++;
            stats[stdAuthor].books.push(book.title);
          });
        });
        let sorted = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) sorted = sorted.filter(([name]) => name.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR')));
        return sorted;
      };

      const getPublisherStats = () => {
        const stats = {};
        readBooks.forEach(book => {
            const pub = book.publisher || "Bilinmiyor";
            if(pub === "Yayınevi Bilgisi Yok" || pub === "Bilinmiyor") return;
            if (!stats[pub]) stats[pub] = { count: 0, books: [] };
            stats[pub].count++;
            stats[pub].books.push(book.title);
        });
        let sorted = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) sorted = sorted.filter(([name]) => name.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR')));
        return sorted;
      };

      const getGenreStats = () => {
        const stats = {};
        readBooks.forEach(book => {
            const genre = book.genre || "Bilinmiyor";
            if(genre === "Bilinmiyor") return;
            if (!stats[genre]) stats[genre] = { count: 0, books: [] };
            stats[genre].count++;
            stats[genre].books.push(book.title);
        });
        let sorted = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) sorted = sorted.filter(([name]) => name.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR')));
        return sorted;
      };

      const handleBookClickInStats = (bookTitle) => {
        const book = readBooks.find(b => b.title === bookTitle);
        if(book) setSelectedBookDetails(book);
      };

      const openEditModal = (book, source) => setEditingBook({ ...book, source });
      const closeEditModal = () => setEditingBook(null);
      const resetManualBookForm = () => setManualBook({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', description: '', notes: '', readDate: getTodayDate() });

      useEffect(() => {
        try {
          const app = initializeApp(firebaseConfig);
          const authInstance = getAuth(app);
          const firestoreInstance = getFirestore(app);
          setAuth(authInstance);
          setDb(firestoreInstance);
          const unsubscribe = onAuthStateChanged(authInstance, user => {
            setUserId(user ? user.uid : null);
            setIsAuthReady(true);
          });
          return () => unsubscribe();
        } catch (err) { console.error("Firebase başlatılamadı.", err); }
      }, []);

      useEffect(() => {
        if (!isAuthReady || !db || !userId) return;
        const booksUnsubscribe = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), snapshot => {
          setReadBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const libraryUnsubscribe = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/libraryBooks`), snapshot => {
          setLibraryBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const profileUnsubscribe = onSnapshot(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), docSnap => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            setUserName(data.userName || '');
            setUserSurname(data.userSurname || '');
            setCustomGenres(data.customGenres || []);
          } else {
            setUserName(''); setUserSurname(''); setCustomGenres([]);
          }
        });
        return () => { booksUnsubscribe(); libraryUnsubscribe(); profileUnsubscribe(); };
      }, [isAuthReady, db, userId]);

      const showMessage = (content, type) => {
        setMessage({ content, type });
        setTimeout(() => setMessage(null), 4000);
      };
      
      const saveUserProfile = async () => {
        try {
          await setDoc(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), { userName, userSurname }, { merge: true });
          showMessage('Profil bilgileri kaydedildi!', 'success');
        } catch (e) { showMessage("Profil kaydedilirken hata oluştu.", "error"); }
      };

      const handleAddCustomGenre = async () => {
        const formattedGenre = formatTitle(newGenreInput.trim());
        if (!formattedGenre) return showMessage('Lütfen eklenecek tür adını yazın.', 'error');
        if (allGenres.some(g => g.toLocaleLowerCase('tr-TR') === formattedGenre.toLocaleLowerCase('tr-TR'))) {
          return showMessage('Bu tür zaten listede mevcut.', 'error');
        }
        const updatedGenres = [...customGenres, formattedGenre];
        try {
          await setDoc(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), { customGenres: updatedGenres }, { merge: true });
          setNewGenreInput('');
          showMessage(`"${formattedGenre}" türü başarıyla eklendi!`, 'success');
        } catch (e) {
          showMessage('Tür kaydedilirken hata oluştu.', 'error');
        }
      };

      const handleRemoveCustomGenre = async (genreToRemove) => {
        const updatedGenres = customGenres.filter(g => g !== genreToRemove);
        try {
          await setDoc(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), { customGenres: updatedGenres }, { merge: true });
          showMessage(`"${genreToRemove}" türü listeden kaldırıldı.`, 'info');
        } catch (e) {
          showMessage('Tür silinirken hata oluştu.', 'error');
        }
      };
      
      const exportData = () => {
        if (readBooks.length === 0) return showMessage('Dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = readBooks.map(b => `${b.title} - ${b.authors} | Tür: ${b.genre || '-'} ${b.readDate ? `(Okuma: ${formatDisplayDate(b.readDate)})` : ''}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'bunko_okudugum_kitaplar.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        showMessage('Veri başarıyla metin dosyası olarak dışa aktarıldı!', 'success');
      };
      
      const exportLibraryData = () => {
        if (libraryBooks.length === 0) return showMessage('Kütüphanede dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = libraryBooks.map(b => `${b.title} - ${b.authors} | Tür: ${b.genre || '-'}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'bunko_kutuphanem.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        showMessage('Kütüphane verisi başarıyla dışa aktarıldı!', 'success');
      };

      const handlePlainTextImport = async () => {
        if (!plainTextImportList.trim() || !db || !userId) return showMessage('Liste boş.', 'error');
        const lines = plainTextImportList.split('\n').filter(line => line.trim().length > 0);
        const existingBooks = new Set([...readBooks, ...libraryBooks].map(b => `${b.title.toLocaleLowerCase('tr-TR')}-${b.authors.toLocaleLowerCase('tr-TR')}`));
        const newBooksToAdd = [];
        lines.forEach(line => {
            let title = line.trim(), authors = 'Bilinmiyor';
            const separatorMatch = line.match(/(.*)\s*[-–—]\s*(.*)$/);
            if (separatorMatch) { [ ,title, authors] = separatorMatch.map(s => s.trim()); }
            const fTitle = formatTitle(title), fAuthors = formatAuthor(authors);
            const bookKey = `${fTitle.toLocaleLowerCase('tr-TR')}-${fAuthors.toLocaleLowerCase('tr-TR')}`;
            if (!existingBooks.has(bookKey)) {
                newBooksToAdd.push({ title: fTitle, authors: fAuthors, publisher: '', genre: 'Bilinmiyor', notes: '', readDate: '' }); 
                existingBooks.add(bookKey);
            }
        });
        if (newBooksToAdd.length === 0) return showMessage('Yeni kitap bulunamadı.', 'info');
        try {
            const batch = writeBatch(db);
            newBooksToAdd.forEach(book => {
                const newDocRef = doc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
                batch.set(newDocRef, book);
            });
            await batch.commit();
            showMessage(`${newBooksToAdd.length} kitap başarıyla eklendi!`, 'success');
            setPlainTextImportList(''); setShowSettings(false);
        } catch (e) { showMessage('İçe aktarılırken hata oluştu.', 'error'); }
      };

      const searchBooks = async () => {
        if (!searchTerm.trim()) return showMessage('Arama terimi girin.', 'error');
        setLoading(true); setSearchResults([]);
        try {
          const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchTerm)}&limit=10`);
          const data = await res.json();
          if (data.docs && data.docs.length > 0) {
            const books = data.docs.map(item => ({
                id: generateId(), 
                title: formatTitle(item.title || 'Başlık Bilgisi Yok'),
                authors: formatAuthor(item.author_name ? item.author_name.join(', ') : 'Yazar Bilgisi Yok'),
                publisher: item.publisher ? item.publisher[0] : 'Yayınevi Bilgisi Yok',
                genre: 'Bilinmiyor',
                description: '', notes: '' 
            }));
            setSearchResults(books);
          } else { showMessage('Aradığınız kitap bulunamadı.', 'info'); }
        } catch (err) { showMessage('Arama sırasında hata oluştu.', 'error'); } 
        finally { setLoading(false); }
      };

      const addBookToRead = async (book) => {
          const newBook = { 
            title: formatTitle(book.title), authors: formatAuthor(book.authors), 
            publisher: book.publisher, genre: book.genre || 'Bilinmiyor',
            description: book.description, notes: book.notes, readDate: getTodayDate()
          };
          const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
          const snap = await getDocs(q);
          if (snap.docs.some(d => d.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && d.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'))) {
              return showMessage('Bu kitap zaten listenizde var.', 'error');
          }
          try {
              await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), newBook);
              showMessage('Kitap başarıyla eklendi!', 'success'); setSearchResults([]); setSearchTerm('');
          } catch (e) { showMessage('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const handleManualAddBook = async (target) => {
        if (!manualBook.title.trim() || !manualBook.authors.trim()) return showMessage('Başlık ve Yazar zorunludur.', 'error');
        const newBook = { 
            title: formatTitle(manualBook.title), authors: formatAuthor(manualBook.authors), 
            publisher: manualBook.publisher ? manualBook.publisher.trim() : 'Yayınevi Bilgisi Yok', 
            genre: manualBook.genre || 'Bilinmiyor',
            description: manualBook.description || '', notes: manualBook.notes || ''
        };
        if (target === 'read') newBook.readDate = manualBook.readDate || '';

        const colName = target === 'read' ? 'readBooks' : 'libraryBooks';
        const q = query(collection(db, `artifacts/${appId}/users/${userId}/${colName}`));
        const snap = await getDocs(q);
        if (snap.docs.some(d => d.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && d.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'))) {
            return showMessage('Bu kitap zaten listenizde var.', 'error');
        }
        try {
            await addDoc(collection(db, `artifacts/${appId}/users/${userId}/${colName}`), newBook);
            showMessage('Kitap başarıyla eklendi!', 'success'); 
            resetManualBookForm(); setManualAddTarget(null);
        } catch (e) { showMessage('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const saveEditedBook = async () => {
        const { id, source, ...bookData } = editingBook;
        const formatted = {
            ...bookData, 
            title: formatTitle(bookData.title), 
            authors: formatAuthor(bookData.authors),
            publisher: bookData.publisher ? bookData.publisher.trim() : 'Yayınevi Bilgisi Yok',
            genre: bookData.genre || 'Bilinmiyor', 
            readDate: bookData.readDate || ''
        };
        try {
            const colName = source === 'read' ? 'readBooks' : 'libraryBooks';
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/${colName}`, id), formatted);
            showMessage('Kitap güncellendi!', 'success'); closeEditModal();
        } catch (e) { showMessage('Güncellenirken hata oluştu.', 'error'); }
      };

      const removeBook = async (id, from) => {
        const colName = from === 'read' ? 'readBooks' : 'libraryBooks';
        setConfirmation({
            message: 'Bu kitabı silmek istediğinizden emin misiniz?',
            danger: true,
            onConfirm: async () => {
                try { 
                    await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/${colName}`, id)); 
                    showMessage('Kitap silindi!', 'success'); 
                } catch (e) { showMessage('Silinirken hata oluştu.', 'error'); }
            }
        });
      };
      
      const markAsRead = async (book) => {
        const { id, source, ...bookData } = book;
        const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
        const snap = await getDocs(q);
        if (!snap.docs.some(d => d.data().title.toLocaleLowerCase('tr-TR') === bookData.title.toLocaleLowerCase('tr-TR') && d.data().authors.toLocaleLowerCase('tr-TR') === bookData.authors.toLocaleLowerCase('tr-TR'))) {
            await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), { ...bookData, readDate: getTodayDate() });
        }
        showMessage(`${book.title} okundu olarak işaretlendi!`, 'success');
      };

      const handleLogin = async () => { try { await signInWithEmailAndPassword(auth, email, password); } catch(e) { setAuthError('Hatalı giriş.'); } };
      const handleRegister = async () => { try { await createUserWithEmailAndPassword(auth, email, password); } catch(e) { setAuthError('Kayıt başarısız.'); } };
      const handleSignOut = async () => { try { await signOut(auth); setReadBooks([]); setLibraryBooks([]); } catch(e){} };

      const sortBooksList = (books, sortBy) => {
        let activeSort = sortBy;
        if (activeSort === 'onlyRead' || activeSort === 'onlyUnread') activeSort = 'author'; 
        return [...books].sort((a, b) => {
          if (activeSort === 'dateDesc') {
            const dA = a.readDate || ''; const dB = b.readDate || '';
            if (dA === dB) return 0; if (!dA) return 1; if (!dB) return -1;
            return dB.localeCompare(dA); 
          }
          if (activeSort === 'dateAsc') {
            const dA = a.readDate || ''; const dB = b.readDate || '';
            if (!dA) return 1; if (!dB) return -1;
            return dA.localeCompare(dB); 
          }
          if (activeSort === 'author') return (a.authors || '').localeCompare(b.authors || '', 'tr-TR');
          if (activeSort === 'title') return (a.title || '').localeCompare(b.title || '', 'tr-TR');
          if (activeSort === 'publisher') return (a.publisher || '').localeCompare(b.publisher || '', 'tr-TR');
          if (activeSort === 'genre') return (a.genre || '').localeCompare(b.genre || '', 'tr-TR');
          return 0;
        });
      };

      const filteredReadBooks = readBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = readBooksGenreFilter === '' || book.genre === readBooksGenreFilter;
          return matchesSearch && matchesGenre;
      });
      const sortedReadBooks = sortBooksList(filteredReadBooks, readBooksSortBy);

      const filteredLibraryBooks = libraryBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = libraryGenreFilter === '' || book.genre === libraryGenreFilter;
          
          const isRead = readBooks.some(rb => rb.title === book.title && rb.authors === book.authors);
          let matchesStatus = true;
          if (librarySortBy === 'onlyRead') matchesStatus = isRead;
          if (librarySortBy === 'onlyUnread') matchesStatus = !isRead;

          return matchesSearch && matchesGenre && matchesStatus;
      });
      const sortedLibraryBooks = sortBooksList(filteredLibraryBooks, librarySortBy);

      const availableReadGenres = Array.from(new Set(readBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort((a, b) => a.localeCompare(b, 'tr-TR'));
      const availableLibraryGenres = Array.from(new Set(libraryBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort((a, b) => a.localeCompare(b, 'tr-TR'));

      if (!isAuthReady) return <div className="min-h-screen flex items-center justify-center text-white text-xl">Yükleniyor...</div>;

      if (!userId) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            {message && (<div className={`fixed top-4 left-1/2 -translate-x-1/2 p-4 rounded-xl shadow-lg z-50 ${message.type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white`}>{message.content}</div>)}
            <div className="glass-panel p-8 rounded-2xl w-full max-w-md text-center">
              <BunkoLogo size="w-24 h-24" />
              <h1 className="text-3xl font-extrabold font-montserrat neon-title-yellow mb-2">Bunko (文庫)</h1>
              <p className="text-xs italic neon-dark-pink mb-6">"Bir gün bir kitap okudum ve bütün hayatım değişti." - Yeni Hayat, Orhan Pamuk</p>
              <h2 className="text-xl font-bold text-gray-200 mb-4">{isLoginMode ? 'Giriş Yap' : 'Kaydol'}</h2>
              {authError && <p className="text-red-400 text-center mb-4 font-medium">{authError}</p>}
              <input type="email" placeholder="E-posta" className="input-dark w-full p-3.5 mb-4 rounded-xl" value={email} onChange={(e) => setEmail(e.target.value)} />
              <input type="password" placeholder="Şifre" className="input-dark w-full p-3.5 mb-6 rounded-xl" value={password} onChange={(e) => setPassword(e.target.value)} />
              <button onClick={isLoginMode ? handleLogin : handleRegister} className="btn-black w-full py-3.5 rounded-xl font-bold text-lg tracking-wide">{isLoginMode ? 'GİRİŞ YAP' : 'KAYDOL'}</button>
              <p className="text-center mt-6"> 
                  <button onClick={() => setIsLoginMode(!isLoginMode)} className="text-emerald-400 hover:text-emerald-300 hover:underline transition-all">
                      {isLoginMode ? 'Hesabın yok mu? Yeni kayıt oluştur.' : 'Zaten hesabın var mı? Giriş yap.'}
                  </button> 
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen py-8 px-4 sm:px-6">
          <datalist id="publishers-datalist">
            {savedPublishers.map(pub => (
              <option key={pub} value={pub} />
            ))}
          </datalist>

          {message && (<div className={`fixed top-4 left-1/2 -translate-x-1/2 p-4 px-6 rounded-xl shadow-2xl z-[100] font-medium ${message.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white`}>{message.content}</div>)}
          
          {confirmation && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                <div className="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-4 border-rose-500">
                    <h3 className="text-xl font-bold text-white mb-8">{confirmation.message}</h3>
                    <div className="flex justify-center gap-4">
                        <button onClick={() => setConfirmation(null)} className="px-6 py-3 bg-gray-600 text-white font-semibold rounded-xl hover:bg-gray-500 transition-colors">İptal Et</button>
                        <button onClick={() => { confirmation.onConfirm(); setConfirmation(null); }} className="px-6 py-3 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-500 shadow-[0_0_15px_rgba(225,29,72,0.4)] transition-all">Evet, Sil</button>
                    </div>
                </div>
            </div>
          )}

          <div className="max-w-6xl mx-auto glass-panel p-5 sm:p-8 rounded-2xl relative shadow-2xl">
            
            {/* BUNKO İKONU, NEON SARI BAŞLIK VE KOYU NEON PEMBE ORHAN PAMUK ALINTISI */}
            <div className="pt-2">
              <BunkoLogo size="w-28 h-28 sm:w-32 sm:h-32" />
              <h1 className="text-4xl sm:text-5xl font-extrabold text-center font-montserrat neon-title-yellow tracking-wide mb-3">
                  Bunko (文庫)
              </h1>
              <p className="text-center mb-8 text-[1.1rem] font-semibold italic tracking-wide neon-dark-pink">
                  "Bir gün bir kitap okudum ve bütün hayatım değişti." - Yeni Hayat, Orhan Pamuk
              </p>
            </div>

            {(userName || userSurname) && (<p className="text-lg text-gray-400 text-center mb-8 font-medium">Hoş Geldin, <span className="text-white">{userName} {userSurname}</span></p>)}
            
            <div className="flex flex-wrap justify-center gap-3 my-8 border-b border-emerald-900/40 pb-8">
              <button onClick={() => setShowLibrary(true)} className="btn-black px-6 py-3 rounded-xl font-bold">Kütüphanem ({libraryBooks.length})</button>
              <button onClick={() => {setShowStats(true); setStatsTab('authors');}} className="btn-black px-6 py-3 rounded-xl font-bold">İstatistikler</button>
              <button onClick={() => setShowSettings(true)} className="btn-black px-6 py-3 rounded-xl font-bold">Ayarlar</button>
              <button onClick={handleSignOut} className="btn-black px-6 py-3 rounded-xl font-bold text-gray-400 hover:text-white">Çıkış Yap</button>
            </div>
            
            <div className="mb-10 bg-black/40 p-6 sm:p-8 rounded-2xl border border-emerald-900/30 shadow-inner">
              <h2 className="text-2xl font-bold mb-5 text-white flex items-center gap-2">
                  <svg className="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                  Yeni Kitap Ekle
              </h2>
              <div className="flex flex-col md:flex-row gap-3">
                  <div className="relative flex-grow">
                      <input type="text" className="input-dark w-full p-4 pr-12 rounded-xl text-lg font-medium h-full" placeholder="İnternette kitap veya yazar ara..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && searchBooks()} />
                      {searchTerm && <button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-white text-xl">&times;</button>}
                  </div>
                  <button onClick={searchBooks} className="btn-black w-full md:w-auto px-8 py-4 rounded-xl font-extrabold text-lg" disabled={loading}>{loading ? 'Aranıyor...' : 'İnternette Ara'}</button>
                  <button onClick={() => {resetManualBookForm(); setManualAddTarget('read');}} className="btn-black w-full md:w-auto px-8 py-4 rounded-xl font-extrabold text-lg border-emerald-900 text-emerald-400 hover:text-emerald-300 whitespace-nowrap">Manuel Ekle</button>
              </div>
            </div>
            
            {searchResults.length > 0 && (
              <div className="relative mb-10 bg-black/40 p-6 sm:p-8 rounded-2xl border border-emerald-900/50 shadow-[0_0_20px_rgba(52,211,153,0.1)]">
                <button onClick={() => setSearchResults([])} className="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-800 transition-colors">&times;</button>
                <h2 className="text-2xl font-bold mb-6 text-white text-emerald-400">Arama Sonuçları</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {searchResults.map(book => (
                    <div key={book.id} className="book-cover-card p-5 flex flex-col justify-between book-spine">
                        <div>
                            <h3 className="text-lg font-bold text-white mb-1.5 leading-snug drop-shadow-md">{book.title}</h3>
                            <p className="text-sm font-semibold text-emerald-300 mb-3 drop-shadow">{book.authors}</p>
                        </div>
                        <div className="mt-auto flex flex-col gap-3">
                            {book.publisher && book.publisher !== 'Yayınevi Bilgisi Yok' && (<p className="text-xs text-gray-400">Yayınevi: <span className="text-gray-200">{book.publisher}</span></p>)}
                            <button onClick={() => addBookToRead(book)} className="btn-black w-full py-2.5 rounded-lg text-sm font-bold mt-1 border-emerald-800 text-emerald-300">Okuduklarıma Ekle</button>
                        </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            <div className="p-6 sm:p-8">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-emerald-900/40 pb-6">
                  <h2 className="text-3xl font-extrabold text-white flex items-center gap-3">
                      Okuduğum Kitaplar
                      <span className="bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 text-lg px-3.5 py-1 rounded-full">{readBooks.length}</span>
                  </h2>
              </div>
              
              <div className="flex flex-col md:flex-row gap-3 mb-8">
                <div className="relative flex-grow">
                    <input type="text" className="input-dark w-full p-3.5 pr-10 rounded-xl" placeholder="Okuduklarımda kitap veya yazar ara..." value={readBooksFilterTerm} onChange={(e) => setReadBooksFilterTerm(e.target.value)} />
                    {readBooksFilterTerm && <button onClick={() => setReadBooksFilterTerm('')} className="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-white">&times;</button>}
                </div>
                
                <select className="input-dark rounded-xl p-3.5 font-medium w-full md:w-48 appearance-none" value={readBooksGenreFilter} onChange={(e) => setReadBooksGenreFilter(e.target.value)}>
                    <option value="">Tüm Türler</option>
                    {availableReadGenres.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
                
                <select className="input-dark rounded-xl p-3.5 font-medium w-full md:w-56 appearance-none" value={readBooksSortBy} onChange={(e) => setReadBooksSortBy(e.target.value)}>
                    <option value="dateDesc">Sırala: Tarih (Yeni - Eski)</option>
                    <option value="dateAsc">Sırala: Tarih (Eski - Yeni)</option>
                    <option value="author">Sırala: Yazar (A-Z)</option>
                    <option value="title">Sırala: Kitap Adı (A-Z)</option>
                    <option value="publisher">Sırala: Yayınevi (A-Z)</option>
                    <option value="genre">Sırala: Tür (A-Z)</option>
                </select>
              </div>

              {sortedReadBooks.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {sortedReadBooks.map(book => (
                    <div key={book.id} className="book-cover-card p-6 flex flex-col justify-between book-spine min-h-[220px]">
                      <div>
                        <h3 className="text-xl font-bold text-white mb-2 leading-tight drop-shadow-md">{book.title}</h3>
                        <p className="text-sm font-semibold text-emerald-400 mb-3 drop-shadow">{book.authors}</p>
                        <div className="flex flex-wrap gap-2 mb-2">
                            {book.genre && book.genre !== 'Bilinmiyor' && <span className="text-[10px] font-bold bg-black/60 text-gray-300 px-2 py-1 rounded border border-gray-600 uppercase tracking-wider">{book.genre}</span>}
                        </div>
                      </div>
                      <div className="mt-auto pt-4 flex flex-col gap-2">
                        {book.publisher && book.publisher !== 'Yayınevi Bilgisi Yok' && (<p className="text-xs text-gray-400">Yayınevi: <span className="text-gray-200">{book.publisher}</span></p>)}
                        {book.readDate && (
                            <p className="text-xs text-emerald-400 font-bold flex items-center gap-1.5 bg-emerald-900/20 w-fit px-2 py-1 rounded border border-emerald-800/50 mt-1">
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                {formatDisplayDate(book.readDate)}
                            </p>
                        )}

                            <span className="bg-emerald-500/20 text-emerald-400 text-lg px-4 py-1 rounded-full border border-emerald-500/30">{selectedAuthorBooks.length} Kitap</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedAuthorName(''); setSelectedAuthorBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedAuthorBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-emerald-900/40 cursor-pointer hover:border-emerald-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : selectedPublisherName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-emerald-900/40 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedPublisherName} 
                            <span className="bg-emerald-500/20 text-emerald-400 text-lg px-4 py-1 rounded-full border border-emerald-500/30">{selectedPublisherBooks.length} Kitap</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedPublisherName(''); setSelectedPublisherBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedPublisherBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-emerald-900/40 cursor-pointer hover:border-emerald-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : selectedGenreName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-emerald-900/40 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedGenreName} 
                            <span className="bg-emerald-500/20 text-emerald-400 text-lg px-4 py-1 rounded-full border border-emerald-500/30">{selectedGenreBooks.length} Kitap</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedGenreName(''); setSelectedGenreBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedGenreBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-emerald-900/40 cursor-pointer hover:border-emerald-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="border-b border-emerald-900/40 mb-8">
                      <nav className="-mb-px flex gap-2 sm:gap-6 overflow-x-auto pb-2">
                        <button onClick={() => setStatsTab('authors')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'authors' ? 'border-emerald-500 text-emerald-400 bg-emerald-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Yazarlar</button>
                        <button onClick={() => setStatsTab('publishers')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'publishers' ? 'border-emerald-500 text-emerald-400 bg-emerald-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Yayınevleri</button>
                        <button onClick={() => setStatsTab('genres')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'genres' ? 'border-emerald-500 text-emerald-400 bg-emerald-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Türler</button>
                      </nav>
                    </div>
                    <div className="flex-1 flex flex-col min-h-0">
                      <div className="relative mb-8">
                        <input type="text" placeholder={`${statsTab === 'authors' ? 'Yazar' : statsTab === 'publishers' ? 'Yayınevi' : 'Tür'} ara...`} className="input-dark w-full p-4 pr-12 rounded-xl text-lg" value={statsSearchTerm} onChange={(e) => setStatsSearchTerm(e.target.value)} />
                        {statsSearchTerm && <button onClick={() => setStatsSearchTerm('')} className="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-white text-xl">&times;</button>}
                      </div>
                      <div className="flex-1 overflow-y-auto modal-scroll pr-3">
                        {statsTab === 'authors' && (getAuthorStats().length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-emerald-900/50"><p className="text-gray-400 text-xl font-medium">Yazar istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getAuthorStats().map(([authorName, data]) => (
                                    <div key={authorName} onClick={() => {setSelectedAuthorName(authorName); setSelectedAuthorBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-emerald-900/40 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{authorName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'publishers' && (getPublisherStats().length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-emerald-900/50"><p className="text-gray-400 text-xl font-medium">Yayınevi istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getPublisherStats().map(([publisherName, data]) => (
                                    <div key={publisherName} onClick={() => {setSelectedPublisherName(publisherName); setSelectedPublisherBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-emerald-900/40 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{publisherName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'genres' && (getGenreStats().length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-emerald-900/50"><p className="text-gray-400 text-xl font-medium">Tür istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getGenreStats().map(([genreName, data]) => (
                                    <div key={genreName} onClick={() => {setSelectedGenreName(genreName); setSelectedGenreBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-emerald-900/40 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{genreName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const startApp = () => {
        if (window.firebaseAPI) {
            ReactDOM.render(<App />, document.getElementById('root'));
        } else {
            setTimeout(startApp, 50);
        }
    };
    startApp();
  </script>

</body>
</html>
