    function App() {

      } = window.firebaseAPI;

      const firebaseConfig = {
        apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
        authDomain: "okudugumkitaplarapp.firebaseapp.com",
        projectId: "okudugumkitaplarapp",
        storageBucket: "okudugumkitaplarapp.firebasestorage.app",
        messagingSenderId: "292934565697",
        appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
        measurementId: "G-V0EFGVV2CR"
      };
      const appId = firebaseConfig.projectId;

      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [userId, setUserId] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      
      const [searchTerm, setSearchTerm] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [readBooks, setReadBooks] = useState([]);
      const [libraryBooks, setLibraryBooks] = useState([]);
      const [readingListBooks, setReadingListBooks] = useState([]);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null); 
      
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false); 
      const [showLibrary, setShowLibrary] = useState(false); 
      const [showReadingList, setShowReadingList] = useState(false);

      const [userName, setUserName] = useState('');
      const [userSurname, setUserSurname] = useState('');
      const [customGenres, setCustomGenres] = useState([]);
      const [newGenreInput, setNewGenreInput] = useState('');
      
      const [readBooksViewMode, setReadBooksViewMode] = useState('grid');
      const [libraryViewMode, setLibraryViewMode] = useState('grid');
      const [readingListViewMode, setReadingListViewMode] = useState('grid');

      const [readBooksFilterTerm, setReadBooksFilterTerm] = useState('');
      const [readBooksGenreFilter, setReadBooksGenreFilter] = useState(''); 
      const [readBooksSortBy, setReadBooksSortBy] = useState('dateDesc'); 
      
      const [libraryFilterTerm, setLibraryFilterTerm] = useState('');
      const [libraryGenreFilter, setLibraryGenreFilter] = useState(''); 
      const [librarySortBy, setLibrarySortBy] = useState('author'); 

      const [readingListFilterTerm, setReadingListFilterTerm] = useState('');
      const [readingListGenreFilter, setReadingListGenreFilter] = useState('');
      const [readingListSortBy, setReadingListSortBy] = useState('author');
      
      const [editingBook, setEditingBook] = useState(null);
      const [candidateCovers, setCandidateCovers] = useState([]);
      const [loadingCandidates, setLoadingCandidates] = useState(false);

      const [plainTextImportList, setPlainTextImportList] = useState('');
      const [manualAddTarget, setManualAddTarget] = useState(null); // 'read', 'library', 'readingList'
      const [manualBook, setManualBook] = useState({ title: '', authors: '', publisher: '', genre: 'Bilinmiyor', coverUrl: '', description: '', notes: '', readDate: '' });
      
      const [selectedAuthorBooks, setSelectedAuthorBooks] = useState([]);
      const [selectedAuthorName, setSelectedAuthorName] = useState('');
      const [selectedPublisherBooks, setSelectedPublisherBooks] = useState([]);
      const [selectedPublisherName, setSelectedPublisherName] = useState('');
      const [selectedGenreBooks, setSelectedGenreBooks] = useState([]); 
      const [selectedGenreName, setSelectedGenreName] = useState(''); 
      const [selectedBookDetails, setSelectedBookDetails] = useState(null);
      
      const [statsSearchTerm, setStatsSearchTerm] = useState('');
      const [statsTab, setStatsTab] = useState('authors'); 
      const [showBackToTop, setShowBackToTop] = useState(false);
      const [confirmation, setConfirmation] = useState(null);

      // Otomatik Kapak Tarama State'leri
      const [isAutoScanning, setIsAutoScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState({ current: 0, total: 0, currentTitle: '', updated: 0 });
      const [singleScanningId, setSingleScanningId] = useState(null);
      const stopScanRef = useRef(false);

      const getTodayDate = () => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const formatDisplayDate = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) {
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }
        return dateString;
      };

      useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const formatTitle = (title) => {
        if (!title) return '';
        return title.toLocaleLowerCase('tr-TR').split(' ').map(word => word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1)).join(' ');
      };

      const formatAuthor = (author) => {
        if (!author) return '';
        const lowerCaseAuthor = author.toLocaleLowerCase('tr-TR').trim();
        const omerSeyfettinVariations = ['ömer seyfettin', 'omer seyfettin', 'ö. seyfettin', 'o. seyfettin', 'ö.seyfettin', 'o.seyfettin', 'ö. seyfetin', 'o. seyfetin'];
        if (omerSeyfettinVariations.includes(lowerCaseAuthor)) return 'Ömer Seyfettin';
        const halidZiyaVariations = ['halid ziya', 'halit ziya', 'hâlid ziya', 'halid ziya uşaklıgil', 'halit ziya uşaklıgil', 'hâlid ziya uşaklıgil'];
        if (halidZiyaVariations.includes(lowerCaseAuthor)) return 'Halid Ziya Uşaklıgil';
        
        return lowerCaseAuthor.split(' ').map(word => {
          if (!word) return '';
          return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1);
        }).join(' ');
      };

      // Metin karşılaştırma için Türkçe duyarlı sadeleştirici
      const normalizeText = (str) => {
        if (!str) return '';
        return str
          .toLocaleLowerCase('tr-TR')
          .replace(/[âîû]/g, c => ({ 'â': 'a', 'î': 'i', 'û': 'u' }[c] || c))
          .replace(/[^\w\sğüşıöç]/gi, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      };

      const isSameBookIdentity = (b1, b2) => {
        return normalizeText(b1.title) === normalizeText(b2.title) &&
               normalizeText(b1.authors) === normalizeText(b2.authors);
      };

      const allGenres = Array.from(new Set([...PREDEFINED_GENRES, ...customGenres])).sort((a, b) => {
        if (a === 'Diğer') return 1;
        if (b === 'Diğer') return -1;
        return a.localeCompare(b, 'tr-TR');
      });

      const savedPublishers = Array.from(new Set(
        [...readBooks, ...libraryBooks, ...readingListBooks]
          .map(b => (b.publisher || '').trim())
          .filter(p => p && p !== 'Yayınevi Bilgisi Yok' && p !== 'Bilinmiyor')
      )).sort((a, b) => a.localeCompare(b, 'tr-TR'));

      const savedAuthors = Array.from(new Set(
        [...readBooks, ...libraryBooks, ...readingListBooks]
          .map(b => (b.authors || '').trim())
          .filter(a => a && a !== 'Yazar Bilgisi Yok' && a !== 'Bilinmiyor')
      )).sort((a, b) => a.localeCompare(b, 'tr-TR'));

      // ============================================================================
      // PUANLAMALI AKILLI KİTAP & KAPAK ARAMA MOTORU (Yüksek Doğruluk + Yüksek Bulma Oranı)
      // ============================================================================

      const computeRelevanceScore = (candidate, targetTitle, targetAuthor) => {
        const cTitle = normalizeText(candidate.title);
        const tTitle = normalizeText(targetTitle);
        const cAuthor = normalizeText(candidate.authors);
        const tAuthor = normalizeText(targetAuthor);

        if (!cTitle || !tTitle) return -100;

        let score = 0;

        // 1. Başlık Uyumu
        if (cTitle === tTitle) {
          score += 65;
        } else if (cTitle.startsWith(tTitle) || tTitle.startsWith(cTitle)) {
          score += 45;
        } else if (cTitle.includes(tTitle) || tTitle.includes(cTitle)) {
          score += 30;
        } else {
          const tWords = tTitle.split(' ').filter(w => w.length > 2);
          if (tWords.length > 0) {
            const matched = tWords.filter(w => cTitle.includes(w)).length;
            if (matched === tWords.length) score += 35;
            else if (matched > 0) score += (matched / tWords.length) * 20;
            else score -= 35;
          } else {
            score -= 25;
          }
        }

        // 2. Yazar Uyumu
        if (tAuthor && tAuthor !== 'bilinmiyor' && tAuthor !== 'yazar bilgisi yok') {
          const authorWords = tAuthor.split(' ').filter(w => w.length > 2);
          const lastWord = authorWords[authorWords.length - 1] || tAuthor;
          if (cAuthor.includes(lastWord)) {
            score += 45;
          } else if (authorWords.some(w => cAuthor.includes(w))) {
            score += 25;
          } else if (cAuthor === 'yazar bilgisi yok' || cAuthor === 'bilinmiyor') {
            score -= 5;
          } else {
            // Farklı bir yazarın aynı isimli kitabıysa puan kır
            score -= 25;
          }
        }

        // 3. Dil ve Kapak Kalitesi Bonusları
        if (candidate.language === 'tr') score += 20;
        if (candidate.coverUrl) score += 15;
        if (candidate.publisher && candidate.publisher !== 'Yayınevi Bilgisi Yok') score += 5;

        return score;
      };

      const fetchGoogleBooksQuery = async (qParam, langRestrict = '') => {
        try {
          const langPart = langRestrict ? `&langRestrict=${langRestrict}` : '';
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(qParam)}&maxResults=15&printType=books${langPart}`);
          if (!res.ok) return [];
          const data = await res.json();
          if (!data.items || data.items.length === 0) return [];

          return data.items.map(item => {
            const info = item.volumeInfo || {};
            let cover = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || '';
            if (cover) {
              cover = cover.replace('http://', 'https://').replace('&edge=curl', '');
            }
            return {
              id: generateId(),
              title: formatTitle(info.title || 'Başlık Bilgisi Yok'),
              authors: formatAuthor(info.authors ? info.authors.join(', ') : 'Yazar Bilgisi Yok'),
              publisher: info.publisher ? formatTitle(info.publisher) : 'Yayınevi Bilgisi Yok',
              coverUrl: cover,
              language: info.language || '',
              sourceBadge: info.language === 'tr' ? 'Google TR' : 'Google Books',
              genre: 'Bilinmiyor',
              description: info.description || '',
              notes: ''
            };
          });
        } catch (e) {
          return [];
        }
      };

      const fetchOpenLibraryQuery = async (queryUrl) => {
        try {
          const res = await fetch(queryUrl);
          if (!res.ok) return [];
          const data = await res.json();
          if (!data.docs || data.docs.length === 0) return [];

          return data.docs.map(item => {
            let cover = '';
            if (item.cover_i) {
              cover = `https://covers.openlibrary.org/b/id/${item.cover_i}-L.jpg`;
            } else if (item.isbn && item.isbn.length > 0) {
              cover = `https://covers.openlibrary.org/b/isbn/${item.isbn[0]}-L.jpg?default=false`;
            }
            return {
              id: generateId(),
              title: formatTitle(item.title || 'Başlık Bilgisi Yok'),
              authors: formatAuthor(item.author_name ? item.author_name.join(', ') : 'Yazar Bilgisi Yok'),
              publisher: item.publisher && item.publisher.length > 0 ? formatTitle(item.publisher[0]) : 'Yayınevi Bilgisi Yok',
              coverUrl: cover,
              language: item.language && item.language.includes('tur') ? 'tr' : '',
              sourceBadge: 'OpenLibrary',
              genre: 'Bilinmiyor',
              description: '',
              notes: ''
            };
          });
        } catch (e) {
          return [];
        }
      };

      // Genel Arama Kutusu İçin Birleştirilmiş Arama
      const fetchTurkishBooksCombined = async (queryText) => {
        const [gTr, gAll, olRes] = await Promise.all([
          fetchGoogleBooksQuery(queryText, 'tr'),
          fetchGoogleBooksQuery(queryText, ''),
          fetchOpenLibraryQuery(`https://openlibrary.org/search.json?q=${encodeURIComponent(queryText)}&limit=15`)
        ]);

        const combined = [...gTr, ...gAll, ...olRes];
        const uniqueMap = new Map();

        combined.forEach(item => {
          const key = `${normalizeText(item.title)}_${item.coverUrl || normalizeText(item.authors)}`;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, item);
          }
        });

        const finalResults = Array.from(uniqueMap.values());
        finalResults.sort((a, b) => {
          const aHasCover = a.coverUrl ? 1 : 0;
          const bHasCover = b.coverUrl ? 1 : 0;
          if (bHasCover !== aHasCover) return bHasCover - aHasCover;
          const aTr = a.language === 'tr' ? 1 : 0;
          const bTr = b.language === 'tr' ? 1 : 0;
          return bTr - aTr;
        });
        return finalResults;
      };

      // Tekil Kitap İçin En Doğru Kapağı Bulan Puanlamalı Fonksiyon
      const findBestCoverForBook = async (title, authors) => {
        const cleanTitle = (title || '').trim();
        const cleanAuthor = authors && authors !== 'Bilinmiyor' && authors !== 'Yazar Bilgisi Yok' ? authors.split(',')[0].trim() : '';

        const structuredQuery = cleanAuthor ? `intitle:${cleanTitle} inauthor:${cleanAuthor}` : `intitle:${cleanTitle}`;
        const plainQuery = `${cleanTitle} ${cleanAuthor}`.trim();

        const [gStructuredTr, gPlain, olStructured] = await Promise.all([
          fetchGoogleBooksQuery(structuredQuery, 'tr'),
          fetchGoogleBooksQuery(plainQuery, ''),
          fetchOpenLibraryQuery(
            cleanAuthor 
              ? `https://openlibrary.org/search.json?title=${encodeURIComponent(cleanTitle)}&author=${encodeURIComponent(cleanAuthor)}&limit=10`
              : `https://openlibrary.org/search.json?title=${encodeURIComponent(cleanTitle)}&limit=10`
          )
        ]);

        let candidates = [...gStructuredTr, ...gPlain, ...olStructured].filter(c => c.coverUrl && c.coverUrl.trim() !== '');

        // Eğer ilk aşamada kapaklı sonuç çıkmadıysa sadece başlıkla yedek arama yap
        if (candidates.length === 0 && cleanAuthor) {
          const [gTitleTr, olTitle] = await Promise.all([
            fetchGoogleBooksQuery(`intitle:${cleanTitle}`, 'tr'),
            fetchOpenLibraryQuery(`https://openlibrary.org/search.json?q=${encodeURIComponent(cleanTitle)}&limit=10`)
          ]);
          candidates = [...gTitleTr, ...olTitle].filter(c => c.coverUrl && c.coverUrl.trim() !== '');
        }

        if (candidates.length === 0) return null;

        // Tüm adayları puanla ve en yüksek puanlıyı seç
        const scored = candidates.map(c => ({
          ...c,
          _score: computeRelevanceScore(c, cleanTitle, cleanAuthor)
        })).sort((a, b) => b._score - a._score);

        // En iyi aday makul bir eşik puanının (25) üzerindeyse döndür
        if (scored[0]._score >= 25) {
          return scored[0];
        }
        return null;
      };

      const loadCandidateCoversForModal = async (title, authors) => {
        setLoadingCandidates(true);
        setCandidateCovers([]);
        try {
          const cleanTitle = (title || '').trim();
          const cleanAuthor = authors && authors !== 'Bilinmiyor' && authors !== 'Yazar Bilgisi Yok' ? authors.split(',')[0].trim() : '';
          const res1 = await fetchTurkishBooksCombined(`${cleanTitle} ${cleanAuthor}`.trim());
          const res2 = cleanAuthor ? await fetchTurkishBooksCombined(cleanTitle) : [];
          const all = [...res1, ...res2].filter(r => r.coverUrl && r.coverUrl.trim() !== '');
          
          const seenUrls = new Set();
          const uniqueCovers = [];
          all.forEach(item => {
            if (!seenUrls.has(item.coverUrl)) {
              seenUrls.add(item.coverUrl);
              uniqueCovers.push({
                ...item,
                _score: computeRelevanceScore(item, cleanTitle, cleanAuthor)
              });
            }
          });
          uniqueCovers.sort((a, b) => b._score - a._score);
          setCandidateCovers(uniqueCovers.slice(0, 12));
          if (uniqueCovers.length === 0) {
            showMessage('Alternatif kapak bulunamadı. Sağdaki Google Görseller butonunu kullanabilirsiniz.', 'info');
          }
        } catch (e) {
          showMessage('Kapak adayları yüklenirken hata oluştu.', 'error');
        } finally {
          setLoadingCandidates(false);
        }
      };

      // ============================================================================
      // ÇAPRAZ SENKRONİZASYON (Okuduklarım ↔ Kütüphanem ↔ Okuma Listem)
      // ============================================================================
      const syncBookAcrossAllCollections = async (originalBook, updatedFields, sourceColName) => {
        if (!db || !userId) return 0;
        const collectionsMap = [
          { name: 'readBooks', items: readBooks },
          { name: 'libraryBooks', items: libraryBooks },
          { name: 'readingListBooks', items: readingListBooks }
        ];

        let syncedCount = 0;
        for (const col of collectionsMap) {
          if (col.name === sourceColName) continue;
          const matchingDocs = col.items.filter(item => isSameBookIdentity(item, originalBook));
          for (const matchDoc of matchingDocs) {
            const payload = {
              title: updatedFields.title ?? matchDoc.title,
              authors: updatedFields.authors ?? matchDoc.authors,
              publisher: updatedFields.publisher ?? matchDoc.publisher,
              genre: updatedFields.genre ?? matchDoc.genre,
              coverUrl: updatedFields.coverUrl !== undefined ? updatedFields.coverUrl : (matchDoc.coverUrl || ''),
              notes: updatedFields.notes !== undefined ? updatedFields.notes : (matchDoc.notes || '')
            };
            await updateDoc(doc(db, `artifacts/${appId}/users/${userId}/${col.name}`, matchDoc.id), payload);
            syncedCount++;
          }
        }
        return syncedCount;
      };

          if (bestMatch && bestMatch.coverUrl) {

            const newPub = (!book.publisher || book.publisher === 'Yayınevi Bilgisi Yok') && bestMatch.publisher && bestMatch.publisher !== 'Yayınevi Bilgisi Yok'
              ? bestMatch.publisher
              : book.publisher;

            const updatedData = { coverUrl: bestMatch.coverUrl, publisher: newPub };
            await updateDoc(doc(db, `artifacts/${appId}/users/${userId}/${colName}`, book.id), updatedData);

            // Diğer listelerde de aynı kitap varsa kapağını ve yayınevini otomatik eşitle
            await syncBookAcrossAllCollections(book, updatedData, colName);

            showMessage(`"${book.title}" için doğru kapak bulundu ve tüm listelerinizde güncellendi!`, 'success');
          } else {

      const handleBatchAutoScanCovers = async (scope = 'all', forceAll = false) => {
        if (!db || !userId || isAutoScanning) return;

        let targetList = [];
        if (scope === 'read' || scope === 'all') {
          readBooks.forEach(b => {
            if (forceAll || !b.coverUrl || b.coverUrl.trim() === '') {
              targetList.push({ ...b, _col: 'readBooks' });
            }
          });
        }
        if (scope === 'library' || scope === 'all') {
          libraryBooks.forEach(b => {
            if (forceAll || !b.coverUrl || b.coverUrl.trim() === '') {
              targetList.push({ ...b, _col: 'libraryBooks' });
            }
          });
        }
        if (scope === 'readingList' || scope === 'all') {
          readingListBooks.forEach(b => {
            if (forceAll || !b.coverUrl || b.coverUrl.trim() === '') {
              targetList.push({ ...b, _col: 'readingListBooks' });
            }
          });
        }

        if (targetList.length === 0) {
          return showMessage('Taranacak kitap bulunamadı!', 'info');
        }

        setIsAutoScanning(true);
        stopScanRef.current = false;
        let updatedCount = 0;

        setScanProgress({ current: 0, total: targetList.length, currentTitle: 'Hazırlanıyor...', updated: 0 });

        for (let i = 0; i < targetList.length; i++) {
          if (stopScanRef.current) break;
          const item = targetList[i];
          setScanProgress({ current: i + 1, total: targetList.length, currentTitle: `${item.title} (${item.authors})`, updated: updatedCount });

          try {
            const match = await findBestCoverForBook(item.title, item.authors);
            if (match && match.coverUrl) {
              const newPub = (!item.publisher || item.publisher === 'Yayınevi Bilgisi Yok') && match.publisher && match.publisher !== 'Yayınevi Bilgisi Yok'
                ? match.publisher
                : item.publisher;
              const updatePayload = { coverUrl: match.coverUrl, publisher: newPub };
              await updateDoc(doc(db, `artifacts/${appId}/users/${userId}/${item._col}`, item.id), updatePayload);
              await syncBookAcrossAllCollections(item, updatePayload, item._col);
              updatedCount++;
              setScanProgress(prev => ({ ...prev, updated: updatedCount }));
            }
          } catch (e) {
            console.error('Kitap tarama hatası:', item.title, e);
          }

          await new Promise(r => setTimeout(r, 950));
        }

        setIsAutoScanning(false);
        showMessage(`Tarama tamamlandı! Toplam ${updatedCount} kitabın kapağı yüksek doğrulukla güncellendi.`, 'success');
      };

      const saveEditedBook = async () => {
        const { id, source, _originalTitle, _originalAuthors, ...bookData } = editingBook;
        const formatted = {
            ...bookData, 
            title: formatTitle(bookData.title), 
            authors: formatAuthor(bookData.authors),
            publisher: bookData.publisher ? bookData.publisher.trim() : 'Yayınevi Bilgisi Yok',
            genre: bookData.genre || 'Bilinmiyor', 
            coverUrl: bookData.coverUrl ? bookData.coverUrl.trim() : '',
            readDate: bookData.readDate || ''
        };
        try {
            const colName = getCollectionNameFromSource(source);
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/${colName}`, id), formatted);

            // Otomatik Çapraz Senkronizasyon: Diğer sekmelerdeki (Kütüphanem / Okuma Listem / Okuduklarım) eşleşen kitabı da güncelle
            const originalIdentity = { 
              title: _originalTitle || formatted.title, 
              authors: _originalAuthors || formatted.authors 
            };
            const syncedCount = await syncBookAcrossAllCollections(originalIdentity, formatted, colName);

            if (syncedCount > 0) {
              showMessage('Kitap güncellendi ve diğer listelerinizle otomatik eşitlendi!', 'success');
            } else {
              showMessage('Kitap güncellendi!', 'success');
            }
            closeEditModal();
        } catch (e) { showMessage('Güncellenirken hata oluştu.', 'error'); }
      };

      const removeBook = async (id, from) => {
        const colName = getCollectionNameFromSource(from);
        setConfirmation({
            message: 'Bu kitabı silmek istediğinizden emin misiniz?',
            danger: true,
            onConfirm: async () => {
                try { 
                    await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/${colName}`, id)); 
                    showMessage('Kitap silindi!', 'success'); 
                } catch (e) { showMessage('Silinirken hata oluştu.', 'error'); }
            }
        });
      };
      
      const markAsRead = async (book, fromSource = 'library') => {
        const { id, source, ...bookData } = book;
        const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
        const snap = await getDocs(q);
        if (!snap.docs.some(d => isSameBookIdentity(d.data(), bookData))) {
            await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), { ...bookData, readDate: getTodayDate() });
        }
        // Eğer Okuma Listesinden "Okudum" denildiyse Okuma Listesinden otomatik çıkar
        if (fromSource === 'readingList' && id) {
            await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/readingListBooks`, id));
            showMessage(`${book.title} okuduklarınıza eklendi ve okuma listesinden tamamlandı olarak kaldırıldı!`, 'success');
        } else {
            showMessage(`${book.title} okundu olarak işaretlendi!`, 'success');
        }
      };

      const handleLogin = async () => { try { await signInWithEmailAndPassword(auth, email, password); } catch(e) { setAuthError('Hatalı giriş.'); } };
      const handleRegister = async () => { try { await createUserWithEmailAndPassword(auth, email, password); } catch(e) { setAuthError('Kayıt başarısız.'); } };
      const handleSignOut = async () => { try { await signOut(auth); setReadBooks([]); setLibraryBooks([]); setReadingListBooks([]); } catch(e){} };

      const sortBooksList = (books, sortBy) => {
        let activeSort = sortBy;
        if (activeSort === 'onlyRead' || activeSort === 'onlyUnread') activeSort = 'author'; 
        return [...books].sort((a, b) => {
          if (activeSort === 'dateDesc') {
            const dA = a.readDate || ''; const dB = b.readDate || '';
            if (dA === dB) return 0; if (!dA) return 1; if (!dB) return -1;
            return dB.localeCompare(dA); 
          }
          if (activeSort === 'dateAsc') {
            const dA = a.readDate || ''; const dB = b.readDate || '';
            if (!dA) return 1; if (!dB) return -1;
            return dA.localeCompare(dB); 
          }
          if (activeSort === 'author') return (a.authors || '').localeCompare(b.authors || '', 'tr-TR');
          if (activeSort === 'title') return (a.title || '').localeCompare(b.title || '', 'tr-TR');
          if (activeSort === 'publisher') return (a.publisher || '').localeCompare(b.publisher || '', 'tr-TR');
          if (activeSort === 'genre') return (a.genre || '').localeCompare(b.genre || '', 'tr-TR');
          return 0;
        });
      };

      const filteredReadBooks = readBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = readBooksGenreFilter === '' || book.genre === readBooksGenreFilter;
          return matchesSearch && matchesGenre;
      });
      const sortedReadBooks = sortBooksList(filteredReadBooks, readBooksSortBy);

      const filteredLibraryBooks = libraryBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = libraryGenreFilter === '' || book.genre === libraryGenreFilter;
          
          const isRead = readBooks.some(rb => isSameBookIdentity(rb, book));
          let matchesStatus = true;
          if (librarySortBy === 'onlyRead') matchesStatus = isRead;
          if (librarySortBy === 'onlyUnread') matchesStatus = !isRead;

          return matchesSearch && matchesGenre && matchesStatus;
      });
      const sortedLibraryBooks = sortBooksList(filteredLibraryBooks, librarySortBy);

      const filteredReadingListBooks = readingListBooks.filter(book => {
          const matchesSearch = book.title.toLocaleLowerCase('tr-TR').includes(readingListFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(readingListFilterTerm.toLocaleLowerCase('tr-TR')));
          const matchesGenre = readingListGenreFilter === '' || book.genre === readingListGenreFilter;
          return matchesSearch && matchesGenre;
      });
      const sortedReadingListBooks = sortBooksList(filteredReadingListBooks, readingListSortBy);

      const availableReadGenres = Array.from(new Set(readBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort((a, b) => a.localeCompare(b, 'tr-TR'));
      const availableLibraryGenres = Array.from(new Set(libraryBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort((a, b) => a.localeCompare(b, 'tr-TR'));
      const availableReadingListGenres = Array.from(new Set(readingListBooks.map(b => b.genre))).filter(g => g && g !== 'Bilinmiyor').sort((a, b) => a.localeCompare(b, 'tr-TR'));

      const missingLibraryCoversCount = libraryBooks.filter(b => !b.coverUrl || b.coverUrl.trim() === '').length;
      const missingReadingListCoversCount = readingListBooks.filter(b => !b.coverUrl || b.coverUrl.trim() === '').length;
      const totalMissingCovers = missingReadCoversCount + missingLibraryCoversCount + missingReadingListCoversCount;

      if (!isAuthReady) return <div className="min-h-screen flex items-center justify-center text-white text-xl">Yükleniyor...</div>;

      if (!userId) {

            <div className="glass-panel p-8 rounded-2xl w-full max-w-md text-center">

              <p className="text-center mt-6"> 
                  <button onClick={() => setIsLoginMode(!isLoginMode)} className="text-emerald-400 hover:text-emerald-300 hover:underline transition-all">
                      {isLoginMode ? 'Hesabın yok mu? Yeni kayıt oluştur.' : 'Zaten hesabın var mı? Giriş yap.'}
                  </button> 
              </p>
            </div>
          </div>
        );

      return (

              <option key={pub} value={pub} />

          <datalist id="authors-datalist">

              <option key={author} value={author} />

                        <button onClick={() => { confirmation.onConfirm(); setConfirmation(null); }} className="px-6 py-3 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-500 shadow-[0_0_15px_rgba(225,29,72,0.4)] transition-all">Evet, Sil</button>
                    </div>
                </div>
            </div>
          )}

          <div className="max-w-6xl mx-auto glass-panel p-5 sm:p-8 rounded-2xl relative shadow-2xl">

                  Bunko (文庫)

            </div>

            {(userName || userSurname) && (<p className="text-lg text-gray-400 text-center mb-8 font-medium">Hoş Geldin, <span className="text-white">{userName} {userSurname}</span></p>)}
            
            <div className="flex flex-wrap justify-center gap-3 my-8 border-b border-emerald-900/40 pb-8">
              <button onClick={() => setShowLibrary(true)} className="btn-black px-6 py-3 rounded-xl font-bold">
                Kütüphanem ({libraryBooks.length})
              </button>
              <button onClick={() => setShowReadingList(true)} className="btn-black px-6 py-3 rounded-xl font-bold border-amber-800/60 text-amber-300">
                Okuma Listem ({readingListBooks.length})
              </button>
              <button onClick={() => {setShowStats(true); setStatsTab('authors');}} className="btn-black px-6 py-3 rounded-xl font-bold">
                İstatistikler
              </button>
              <button onClick={() => setShowSettings(true)} className="btn-black px-6 py-3 rounded-xl font-bold relative">
                Ayarlar & Kapak Tarayıcı
                {totalMissingCovers > 0 && (
                  <span className="ml-2 bg-amber-500 text-black text-xs font-extrabold px-2 py-0.5 rounded-full">
                    {totalMissingCovers}
                  </span>
                )}
              </button>
              <button onClick={handleSignOut} className="btn-black px-6 py-3 rounded-xl font-bold text-gray-400 hover:text-white">
                Çıkış Yap
              </button>
            </div>
            
            <div className="mb-10 bg-black/40 p-6 sm:p-8 rounded-2xl border border-emerald-900/30 shadow-inner">
              <h2 className="text-2xl font-bold mb-5 text-white flex items-center gap-2">
                  <svg className="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                  Yeni Kitap Ekle
              </h2>
              <div className="flex flex-col md:flex-row gap-3">
                  <div className="relative flex-grow">
                      <input type="text" className="input-dark w-full p-4 pr-12 rounded-xl text-lg font-medium h-full" placeholder="Kitap adı, yazar veya ISBN ara..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && searchBooks()} />
                      {searchTerm && <button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-white text-xl">&times;</button>}
                  </div>
                  <button onClick={searchBooks} className="btn-black w-full md:w-auto px-8 py-4 rounded-xl font-extrabold text-lg" disabled={loading}>{loading ? 'Taranıyor...' : 'Kitap Ara'}</button>
                  <button onClick={() => {resetManualBookForm(); setManualAddTarget('read');}} className="btn-black w-full md:w-auto px-6 py-4 rounded-xl font-extrabold text-base border-emerald-900 text-emerald-400 hover:text-emerald-300 whitespace-nowrap">Manuel Ekle</button>
              </div>
            </div>
            
            {searchResults.length > 0 && (
              <div className="relative mb-10 bg-black/40 p-6 sm:p-8 rounded-2xl border border-emerald-900/50 shadow-[0_0_20px_rgba(52,211,153,0.1)]">
                <button onClick={() => setSearchResults([])} className="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-800 transition-colors">&times;</button>
                <h2 className="text-2xl font-bold mb-6 text-emerald-400">Arama Sonuçları ({searchResults.length})</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {searchResults.map(book => (
                    <div key={book.id} className="book-cover-card flex flex-col justify-between book-spine min-h-[360px]">
                        {book.coverUrl ? (
                          <div className="w-full h-48 bg-black/60 flex items-center justify-center p-2 pl-5 border-b border-emerald-900/40 relative">
                            <img 
                              src={book.coverUrl} 
                              alt={book.title} 
                              className="max-h-full max-w-full object-contain rounded shadow-md"
                              onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            {book.sourceBadge && (
                              <span className="absolute top-2 right-2 bg-black/80 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-700/50">
                                {book.sourceBadge}
                              </span>
                            )}
                          </div>
                        ) : (
                          <div className="w-full h-24 bg-black/30 flex items-center justify-center pl-4 border-b border-emerald-900/30">
                            <span className="text-xs text-gray-500 italic">Kapak Görseli Yok</span>
                          </div>
                        )}
                        <div className="p-4 pl-6 flex-1 flex flex-col justify-between">
                          <div>
                              <h3 className="text-base font-bold text-white mb-1 leading-snug line-clamp-2">{book.title}</h3>
                              <p className="text-xs font-semibold text-emerald-300 mb-2">{book.authors}</p>
                              {book.publisher && book.publisher !== 'Yayınevi Bilgisi Yok' && (
                                <p className="text-[11px] text-gray-400 mb-2">Yayınevi: <span className="text-gray-200">{book.publisher}</span></p>
                              )}
                          </div>
                          <div className="mt-3 flex flex-col gap-1.5">
                              <button onClick={() => addBookToCollection(book, 'readBooks')} className="btn-black w-full py-2 rounded-lg text-xs font-bold border-emerald-800 text-emerald-300">
                                + Okuduklarıma Ekle
                              </button>
                              <button onClick={() => addBookToCollection(book, 'libraryBooks')} className="btn-black w-full py-2 rounded-lg text-xs font-bold border-sky-900 text-sky-300">
                                + Kütüphaneme Ekle
                              </button>
                              <button onClick={() => addBookToCollection(book, 'readingListBooks')} className="btn-black w-full py-2 rounded-lg text-xs font-bold border-amber-800 text-amber-300">
                                + Okuma Listeme Ekle
                              </button>
                          </div>
                        </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            <div className="p-4 sm:p-8">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-emerald-900/40 pb-6">
                  <div className="flex items-center gap-3 flex-wrap">
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Okuduğum Kitaplar</h2>
                      <span className="bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 text-sm sm:text-lg px-3 py-0.5 rounded-full">{readBooks.length}</span>
                  </div>
                  
                  <div className="flex bg-black/50 p-1 rounded-xl border border-emerald-900/40 self-stretch sm:self-auto justify-center">
                    <button 
                      onClick={() => setReadBooksViewMode('grid')} 
                      className={`flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all ${readBooksViewMode === 'grid' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                    >
                      Kartlar
                    </button>
                    <button 
                      onClick={() => setReadBooksViewMode('list')} 
                      className={`flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all ${readBooksViewMode === 'list' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                    >
                      Düz Liste
                    </button>
                  </div>
              </div>
              
              <div className="flex flex-col md:flex-row gap-3 mb-8">
                <div className="relative flex-grow">
                    <input type="text" className="input-dark w-full p-3.5 pr-10 rounded-xl" placeholder="Okuduklarımda kitap veya yazar ara..." value={readBooksFilterTerm} onChange={(e) => setReadBooksFilterTerm(e.target.value)} />
                    {readBooksFilterTerm && <button onClick={() => setReadBooksFilterTerm('')} className="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-white">&times;</button>}
                </div>
                
                <select className="input-dark rounded-xl p-3.5 font-medium w-full md:w-48 appearance-none" value={readBooksGenreFilter} onChange={(e) => setReadBooksGenreFilter(e.target.value)}>
                    <option value="">Tüm Türler</option>
                    {availableReadGenres.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
                
                <select className="input-dark rounded-xl p-3.5 font-medium w-full md:w-56 appearance-none" value={readBooksSortBy} onChange={(e) => setReadBooksSortBy(e.target.value)}>
                    <option value="dateDesc">Sırala: Tarih (Yeni - Eski)</option>
                    <option value="dateAsc">Sırala: Tarih (Eski - Yeni)</option>
                    <option value="author">Sırala: Yazar (A-Z)</option>
                    <option value="title">Sırala: Kitap Adı (A-Z)</option>
                    <option value="publisher">Sırala: Yayınevi (A-Z)</option>
                    <option value="genre">Sırala: Tür (A-Z)</option>
                </select>
              </div>

              {sortedReadBooks.length > 0 ? (
                readBooksViewMode === 'grid' ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {sortedReadBooks.map(book => (
                      <div key={book.id} className="book-cover-card flex flex-col justify-between book-spine min-h-[280px]">
                        {book.coverUrl && (
                          <div className="w-full h-52 bg-black/60 flex items-center justify-center p-2 pl-5 border-b border-emerald-900/40">
                            <img 
                              src={book.coverUrl} 
                              alt={book.title} 
                              className="max-h-full max-w-full object-contain rounded shadow-lg"
                              loading="lazy"
                              onError={(e) => { e.target.parentElement.style.display = 'none'; }}
                            />
                          </div>
                        )}
                        <div className="p-5 pl-6 flex-1 flex flex-col justify-between">
                          <div>
                            <h3 className="text-xl font-bold text-white mb-2 leading-tight drop-shadow-md">{book.title}</h3>
                            <p className="text-sm font-semibold text-emerald-400 mb-2.5 drop-shadow">{book.authors}</p>
                            <div className="flex flex-wrap gap-2 mb-2">
                                {book.genre && book.genre !== 'Bilinmiyor' && <span className="text-[10px] font-bold bg-black/60 text-gray-300 px-2 py-1 rounded border border-gray-600 uppercase tracking-wider">{book.genre}</span>}
                            </div>
                          </div>
                          <div className="mt-auto pt-3 flex flex-col gap-1.5">
                            {book.publisher && book.publisher !== 'Yayınevi Bilgisi Yok' && (<p className="text-xs text-gray-400">Yayınevi: <span className="text-gray-200">{book.publisher}</span></p>)}
                            {book.readDate && (
                                <p className="text-xs text-emerald-400 font-bold flex items-center gap-1.5 bg-emerald-900/20 w-fit px-2 py-1 rounded border border-emerald-800/50 mt-1">
                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    {formatDisplayDate(book.readDate)}

                            <div className="flex justify-end gap-2 mt-3 pt-3 border-t border-emerald-900/40">
                              <button 
                                onClick={() => handleRefreshSingleBookCover(book, 'read')} 
                                disabled={singleScanningId === book.id}
                                className="btn-black p-2 rounded-full border-amber-800/60" 
                                title="Kapağı Otomatik Bul / Yenile"
                              >
                                <svg className={`w-4 h-4 text-amber-400 ${singleScanningId === book.id ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

                                      <div className="col-span-2 pt-3 border-t border-emerald-900/40">
                                          <p className="text-xs text-gray-500 uppercase font-bold tracking-wider mb-1">Okuma Tarihi</p>
                                          <p className="text-base text-emerald-400 font-bold flex items-center gap-2">
                                              {selectedBookDetails.readDate ? formatDisplayDate(selectedBookDetails.readDate) : 'Tarih Belirtilmemiş'}
                                          </p>
                                      </div>
                                  </div>
                                </div>
                                <div className="mt-6 pt-4 border-t border-emerald-900/40 flex justify-end">
                                    <button onClick={() => { openEditModal(selectedBookDetails, 'read'); setShowStats(false); }} className="btn-black px-6 py-2.5 rounded-xl font-bold border-emerald-800 text-emerald-400 flex items-center gap-2 text-sm">
                                      Bilgileri Düzenle
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                  </div>
                ) : selectedAuthorName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-emerald-900/40 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedAuthorName} 
                            <span className="bg-emerald-500/20 text-emerald-400 text-lg px-4 py-1 rounded-full border border-emerald-500/30">{selectedAuthorBooks.length} Kitap</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedAuthorName(''); setSelectedAuthorBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedAuthorBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-emerald-900/40 cursor-pointer hover:border-emerald-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : selectedPublisherName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-emerald-900/40 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedPublisherName} 
                            <span className="bg-emerald-500/20 text-emerald-400 text-lg px-4 py-1 rounded-full border border-emerald-500/30">{selectedPublisherBooks.length} Kitap</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedPublisherName(''); setSelectedPublisherBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedPublisherBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-emerald-900/40 cursor-pointer hover:border-emerald-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : selectedGenreName ? (
                  <div className="flex-1 flex flex-col min-h-0 relative">
                    <div className="flex items-center justify-between mb-8 border-b border-emerald-900/40 pb-4 pr-16">
                        <h3 className="text-3xl font-bold text-white flex items-center gap-4">
                            {selectedGenreName} 
                            <span className="bg-emerald-500/20 text-emerald-400 text-lg px-4 py-1 rounded-full border border-emerald-500/30">{selectedGenreBooks.length} Kitap</span>
                        </h3>
                    </div>
                    <button onClick={() => {setSelectedGenreName(''); setSelectedGenreBooks([]);}} className="btn-black absolute top-0 right-0 p-3 rounded-xl border-gray-600 hover:border-gray-400" aria-label="Geri Dön">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div className="overflow-y-auto max-h-[60vh] modal-scroll pr-3">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            {selectedGenreBooks.map((title, i) => (
                                <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-black/60 p-6 rounded-xl border border-emerald-900/40 cursor-pointer hover:border-emerald-500 hover:bg-black/80 transition-all flex items-center justify-between group shadow-lg">
                                    <span className="font-bold text-gray-200 group-hover:text-white text-lg">{title}</span>
                                    <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="border-b border-emerald-900/40 mb-8">
                      <nav className="-mb-px flex gap-2 sm:gap-6 overflow-x-auto pb-2">
                        <button onClick={() => setStatsTab('authors')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'authors' ? 'border-emerald-500 text-emerald-400 bg-emerald-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Yazarlar</button>
                        <button onClick={() => setStatsTab('publishers')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'publishers' ? 'border-emerald-500 text-emerald-400 bg-emerald-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Yayınevleri</button>
                        <button onClick={() => setStatsTab('genres')} className={`shrink-0 border-b-2 px-4 py-3 text-lg font-bold transition-all ${statsTab === 'genres' ? 'border-emerald-500 text-emerald-400 bg-emerald-900/20 rounded-t-xl' : 'border-transparent text-gray-500 hover:text-gray-300'}`}>Türler</button>
                      </nav>
                    </div>
                    <div className="flex-1 flex flex-col min-h-0">
                      <div className="relative mb-8">
                        <input type="text" placeholder={`${statsTab === 'authors' ? 'Yazar' : statsTab === 'publishers' ? 'Yayınevi' : 'Tür'} ara...`} className="input-dark w-full p-4 pr-12 rounded-xl text-lg" value={statsSearchTerm} onChange={(e) => setStatsSearchTerm(e.target.value)} />
                        {statsSearchTerm && <button onClick={() => setStatsSearchTerm('')} className="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-white text-xl">&times;</button>}
                      </div>
                      <div className="flex-1 overflow-y-auto modal-scroll pr-3">
                        {statsTab === 'authors' && (getAuthorStats().length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-emerald-900/50"><p className="text-gray-400 text-xl font-medium">Yazar istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getAuthorStats().map(([authorName, data]) => (
                                    <div key={authorName} onClick={() => {setSelectedAuthorName(authorName); setSelectedAuthorBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-emerald-900/40 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{authorName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'publishers' && (getPublisherStats().length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-emerald-900/50"><p className="text-gray-400 text-xl font-medium">Yayınevi istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getPublisherStats().map(([publisherName, data]) => (
                                    <div key={publisherName} onClick={() => {setSelectedPublisherName(publisherName); setSelectedPublisherBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-emerald-900/40 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{publisherName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'genres' && (getGenreStats().length === 0 ? (<div className="flex justify-center p-12 bg-black/20 rounded-3xl border border-dashed border-emerald-900/50"><p className="text-gray-400 text-xl font-medium">Tür istatistiği bulunamadı.</p></div>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {getGenreStats().map(([genreName, data]) => (
                                    <div key={genreName} onClick={() => {setSelectedGenreName(genreName); setSelectedGenreBooks(data.books);}} className="bg-black/40 p-6 rounded-2xl border border-emerald-900/40 hover:border-emerald-500 hover:bg-black/60 cursor-pointer transition-all flex flex-col justify-between group shadow-xl">
                                        <span className="text-xl font-bold text-white mb-6 group-hover:text-emerald-400 transition-colors leading-tight">{genreName}</span>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="px-4 py-1.5 bg-emerald-900/30 text-emerald-400 text-sm font-bold rounded-lg border border-emerald-800/50">{data.count} Eser</span>
                                            <svg className="w-6 h-6 text-gray-600 group-hover:text-emerald-400 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const startApp = () => {
        if (window.firebaseAPI) {
            ReactDOM.render(<App />, document.getElementById('root'));
        } else {
            setTimeout(startApp, 50);
        }
    };
    startApp();
  </script>

</body>
</html>
