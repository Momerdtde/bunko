<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Okuduğum Kitaplar</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  
  <!-- React Kütüphaneleri -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  
  <!-- Babel (JSX'i tarayıcıda çalıştırmak için) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
        font-family: 'Inter', sans-serif;
    }
    h1, h2, h3.font-montserrat {
        font-family: 'Montserrat', sans-serif;
    }
    .neon-glow {
        filter: drop-shadow(0 0 5px #fef08a) drop-shadow(0 0 10px #fef08a);
    }
    /* Kaydırma çubuğu stilleri */
    .modal-scroll::-webkit-scrollbar {
        width: 8px;
    }
    .modal-scroll::-webkit-scrollbar-track {
        background: #334155;
    }
    .modal-scroll::-webkit-scrollbar-thumb {
        background: #64748b;
        border-radius: 4px;
    }
    .modal-scroll::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-900">

  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";
    window.firebase = { 
        initializeApp, 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { 
        initializeApp, 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
    } = window.firebase;

    // Firebase yapılandırması
    const firebaseConfig = {
      apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
      authDomain: "okudugumkitaplarapp.firebaseapp.com",
      projectId: "okudugumkitaplarapp",
      storageBucket: "okudugumkitaplarapp.firebasestorage.app",
      messagingSenderId: "292934565697",
      appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
      measurementId: "G-V0EFGVV2CR"
    };

    const appId = firebaseConfig.projectId;

    function App() {
      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [userId, setUserId] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [readBooks, setReadBooks] = useState([]);
      const [libraryBooks, setLibraryBooks] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState(null); 
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false); 
      const [showLibrary, setShowLibrary] = useState(false); 
      const [userName, setUserName] = useState('');
      const [userSurname, setUserSurname] = useState('');
      const [readBooksFilterTerm, setReadBooksFilterTerm] = useState('');
      const [libraryFilterTerm, setLibraryFilterTerm] = useState('');
      const [editingBook, setEditingBook] = useState(null);
      const [plainTextImportList, setPlainTextImportList] = useState('');
      const [manualAddTarget, setManualAddTarget] = useState(null);
      const [manualBook, setManualBook] = useState({ title: '', authors: '', publisher: '', description: '', notes: '', readDate: '' });
      const [selectedAuthorBooks, setSelectedAuthorBooks] = useState([]);
      const [selectedAuthorName, setSelectedAuthorName] = useState('');
      const [selectedPublisherBooks, setSelectedPublisherBooks] = useState([]);
      const [selectedPublisherName, setSelectedPublisherName] = useState('');
      const [selectedBookDetails, setSelectedBookDetails] = useState(null);
      const [statsSearchTerm, setStatsSearchTerm] = useState('');
      const [statsTab, setStatsTab] = useState('authors');
      const [showBackToTop, setShowBackToTop] = useState(false);
      const [confirmation, setConfirmation] = useState(null);

      const getTodayDate = () => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const formatDisplayDate = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) {
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }
        return dateString;
      };

      useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      const formatTitle = (title) => {
        if (!title) return '';
        return title
            .toLocaleLowerCase('tr-TR')
            .split(' ')
            .map(word => word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1))
            .join(' ');
      };

      const standardizeAuthorName = (author) => {
        if (!author) return '';
        const lowerCaseAuthor = author.toLocaleLowerCase('tr-TR').trim();
        const omerSeyfettinVariations = ['ömer seyfettin', 'omer seyfettin', 'ö. seyfettin', 'o. seyfettin', 'ö.seyfettin', 'o.seyfettin', 'ö. seyfetin', 'o. seyfetin'];
        const halidZiyaVariations = ['halid ziya', 'halit ziya', 'hâlid ziya', 'halid ziya uşaklıgil', 'halit ziya uşaklıgil', 'hâlid ziya uşaklıgil'];

        if (omerSeyfettinVariations.includes(lowerCaseAuthor)) {
          return 'Ömer Seyfettin';
        }
        if (halidZiyaVariations.includes(lowerCaseAuthor)) {
          return 'Halid Ziya Uşaklıgil';
        }
        return author;
      };

      const formatAuthor = (author) => {
        if (!author) return '';
        let standardized = standardizeAuthorName(author);
        return standardized.split(' ').map(word => {
          if (!word) return '';
          return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1).toLocaleLowerCase('tr-TR');
        }).join(' ');
      };
      
      const getAuthorStats = () => {
        const stats = {};
        readBooks.forEach(book => {
          const authors = book.authors ? book.authors.split(',').map(a => a.trim()).filter(a => a.length > 0) : [];
          authors.forEach(author => {
            const standardizedAuthor = formatAuthor(author);
            if (!stats[standardizedAuthor]) {
              stats[standardizedAuthor] = { count: 0, books: [] };
            }
            stats[standardizedAuthor].count++;
            stats[standardizedAuthor].books.push(book.title);
          });
        });
        let sortedAuthors = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) {
          sortedAuthors = sortedAuthors.filter(([authorName]) =>
            authorName.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR'))
          );
        }
        return sortedAuthors;
      };

      const getPublisherStats = () => {
        const stats = {};
        readBooks.forEach(book => {
            const publisher = book.publisher || "Bilinmiyor";
            if(publisher === "Yayınevi Bilgisi Yok" || publisher === "Bilinmiyor") return;

            if (!stats[publisher]) {
              stats[publisher] = { count: 0, books: [] };
            }
            stats[publisher].count++;
            stats[publisher].books.push(book.title);
        });
        let sortedPublishers = Object.entries(stats).sort(([, a], [, b]) => b.count - a.count);
        if (statsSearchTerm.trim()) {
          sortedPublishers = sortedPublishers.filter(([publisherName]) =>
            publisherName.toLocaleLowerCase('tr-TR').includes(statsSearchTerm.toLocaleLowerCase('tr-TR'))
          );
        }
        return sortedPublishers;
      };

      const handleAuthorClick = (authorName, books) => {
        setSelectedAuthorName(authorName);
        setSelectedAuthorBooks(books);
      };

      const handlePublisherClick = (publisherName, books) => {
        setSelectedPublisherName(publisherName);
        setSelectedPublisherBooks(books);
      };

      const handleBookClickInStats = (bookTitle) => {
        const book = readBooks.find(b => b.title === bookTitle);
        if(book) {
            setSelectedBookDetails(book);
        }
      };

      const openEditModal = (book, source) => setEditingBook({ ...book, source });
      const closeEditModal = () => setEditingBook(null);
      
      const resetManualBookForm = () => {
        setManualBook({ title: '', authors: '', publisher: '', description: '', notes: '', readDate: getTodayDate() });
      };

      useEffect(() => {
        try {
          const app = initializeApp(firebaseConfig);
          const authInstance = getAuth(app);
          const firestoreInstance = getFirestore(app);
          setAuth(authInstance);
          setDb(firestoreInstance);
          const unsubscribe = onAuthStateChanged(authInstance, user => {
            setUserId(user ? user.uid : null);
            setIsAuthReady(true);
          });
          return () => unsubscribe();
        } catch (err) {
          setError("Firebase başlatılamadı.");
        }
      }, []);

      useEffect(() => {
        if (!isAuthReady || !db || !userId) return;

        const booksUnsubscribe = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), snapshot => {
          setReadBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const libraryUnsubscribe = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/libraryBooks`), snapshot => {
          setLibraryBooks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const profileUnsubscribe = onSnapshot(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), docSnap => {
          if (docSnap.exists()) {
            const { userName = '', userSurname = '' } = docSnap.data();
            setUserName(userName);
            setUserSurname(userSurname);
          } else {
            setUserName('');
            setUserSurname('');
          }
        });
        return () => { 
            booksUnsubscribe(); 
            libraryUnsubscribe();
            profileUnsubscribe(); 
        };
      }, [isAuthReady, db, userId]);

      const showMessage = (content, type) => {
        setMessage({ content, type });
        setTimeout(() => setMessage(null), 4000);
      };
      
      const saveUserProfile = async () => {
        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        try {
          await setDoc(doc(db, `artifacts/${appId}/users/${userId}/profile/info`), { userName, userSurname }, { merge: true });
          showMessage('Profil bilgileri kaydedildi!', 'success');
        } catch (e) { showMessage("Profil kaydedilirken hata oluştu.", "error"); }
      };
      
      const exportData = () => {
        if (readBooks.length === 0) return showMessage('Dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = readBooks.map(book => `${book.title} - ${book.authors}${book.readDate ? ` (Okuma: ${formatDisplayDate(book.readDate)})` : ''}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'okudugum_kitaplar.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showMessage('Veri başarıyla metin dosyası olarak dışa aktarıldı!', 'success');
      };
      
      const exportLibraryData = () => {
        if (libraryBooks.length === 0) return showMessage('Kütüphanede dışa aktarılacak kitap bulunmuyor.', 'info');
        const textData = libraryBooks.map(book => `${book.title} - ${book.authors}`).join('\n');
        const blob = new Blob([textData], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'kutuphanem.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showMessage('Kütüphane verisi başarıyla metin dosyası olarak dışa aktarıldı!', 'success');
      };
      
      const handlePlainTextImport = async () => {
        if (!plainTextImportList.trim() || !db || !userId) return showMessage('İçe aktarılacak liste boş veya kullanıcı oturumu hazır değil.', 'error');
        const lines = plainTextImportList.split('\n').filter(line => line.trim().length > 0);
        const existingBooks = new Set([...readBooks, ...libraryBooks].map(b => `${b.title.toLocaleLowerCase('tr-TR')}-${b.authors.toLocaleLowerCase('tr-TR')}`));
        const newBooksToAdd = [];
        
        lines.forEach(line => {
            let title = line.trim(), authors = 'Bilinmiyor';
            const separatorMatch = line.match(/(.*)\s*[-–—]\s*(.*)$/);
            if (separatorMatch) { [ ,title, authors] = separatorMatch.map(s => s.trim()); }
            const formattedTitle = formatTitle(title), formattedAuthors = formatAuthor(authors);
            const bookKey = `${formattedTitle.toLocaleLowerCase('tr-TR')}-${formattedAuthors.toLocaleLowerCase('tr-TR')}`;
            if (!existingBooks.has(bookKey)) {
                newBooksToAdd.push({ title: formattedTitle, authors: formattedAuthors, publisher: '', notes: '', readDate: '' }); 
                existingBooks.add(bookKey);
            }
        });
        if (newBooksToAdd.length === 0) return showMessage('Yeni kitap bulunamadı veya tümü zaten listenizde.', 'info');
        try {
            const batch = writeBatch(db);
            newBooksToAdd.forEach(book => {
                const newDocRef = doc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
                batch.set(newDocRef, book);
            });
            await batch.commit();
            showMessage(`${newBooksToAdd.length} kitap okunanlar listesine başarıyla eklendi!`, 'success');
            setPlainTextImportList(''); setShowSettings(false);
        } catch (e) { showMessage('Kitaplar içe aktarılırken bir hata oluştu.', 'error'); }
      };

      const searchBooks = async () => {
        if (!searchTerm.trim()) return showMessage('Arama terimi girin.', 'error');
        setLoading(true); setError(''); setSearchResults([]);
        try {
          const openLibraryResponse = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchTerm)}&limit=10`);
          const data = await openLibraryResponse.json();

          if (data.docs && data.docs.length > 0) {
            const books = data.docs.map(item => {
              return {
                id: self.crypto.randomUUID(), 
                title: formatTitle(item.title || 'Başlık Bilgisi Yok'),
                authors: formatAuthor(item.author_name ? item.author_name.join(', ') : 'Yazar Bilgisi Yok'),
                publisher: item.publisher ? item.publisher.join(', ') : 'Yayınevi Bilgisi Yok',
                description: '',
                notes: '' 
              };
            });
            setSearchResults(books);
          } else { 
            showMessage('Aradığınız kitap bulunamadı.', 'info'); 
          }
        } catch (err) { 
          showMessage('Kitap arama sırasında bir hata oluştu.', 'error'); 
        } 
        finally { setLoading(false); }
      };

      const addBookToRead = async (book) => {
          if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
          const newBook = { 
            title: formatTitle(book.title), 
            authors: formatAuthor(book.authors), 
            publisher: book.publisher, 
            description: book.description, 
            notes: book.notes,
            readDate: getTodayDate()
          };
          const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
          const querySnapshot = await getDocs(q);
          const exists = querySnapshot.docs.some(doc => doc.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && doc.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'));
          if (exists) return showMessage('Bu kitap zaten okuduklarım listesinde var.', 'error');
          try {
              await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), newBook);
              showMessage('Kitap okuduklarıma başarıyla eklendi!', 'success'); setSearchResults([]); setSearchTerm('');
          } catch (e) { showMessage('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const handleManualAddBook = async (target) => {
        if (!manualBook.title.trim() || !manualBook.authors.trim()) return showMessage('Başlık ve Yazar alanları zorunludur.', 'error');
        const newBook = { 
            title: formatTitle(manualBook.title), 
            authors: formatAuthor(manualBook.authors), 
            publisher: manualBook.publisher || 'Yayınevi Bilgisi Yok', 
            description: manualBook.description || '', 
            notes: manualBook.notes || ''
        };
        if (target === 'read') {
            newBook.readDate = manualBook.readDate || '';
        }

        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        const collectionName = target === 'read' ? 'readBooks' : 'libraryBooks';
        const q = query(collection(db, `artifacts/${appId}/users/${userId}/${collectionName}`));
        const querySnapshot = await getDocs(q);
        const exists = querySnapshot.docs.some(doc => doc.data().title.toLocaleLowerCase('tr-TR') === newBook.title.toLocaleLowerCase('tr-TR') && doc.data().authors.toLocaleLowerCase('tr-TR') === newBook.authors.toLocaleLowerCase('tr-TR'));
        if (exists) return showMessage('Bu kitap zaten listenizde var.', 'error');
        try {
            await addDoc(collection(db, `artifacts/${appId}/users/${userId}/${collectionName}`), newBook);
            showMessage('Kitap başarıyla eklendi!', 'success'); 
            resetManualBookForm(); 
            setManualAddTarget(null);
        } catch (e) { showMessage('Kitap eklenirken hata oluştu.', 'error'); }
      };
      
      const saveEditedBook = async () => {
        if (!db || !userId || !editingBook) return showMessage('Kaydedilecek veri bulunamadı.', 'error');
        const { id, source, ...bookData } = editingBook;
        
        const formattedBookData = {
            ...bookData,
            title: formatTitle(bookData.title),
            authors: formatAuthor(bookData.authors),
            readDate: bookData.readDate || ''
        };

        try {
            const collectionName = source === 'read' ? 'readBooks' : 'libraryBooks';
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/${collectionName}`, id), formattedBookData);
            showMessage('Kitap başarıyla güncellendi!', 'success'); closeEditModal();
        } catch (e) { showMessage('Kitap güncellenirken bir hata oluştu.', 'error'); }
      };

      const removeBook = async (id, from) => {
        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        const collectionName = from === 'read' ? 'readBooks' : 'libraryBooks';
        setConfirmation({
            message: 'Bu kitabı silmek istediğinizden emin misiniz?',
            onConfirm: async () => {
                try { 
                    await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/${collectionName}`, id)); 
                    showMessage('Kitap başarıyla silindi!', 'success'); 
                } catch (e) { 
                    showMessage('Kitap silinirken hata oluştu.', 'error'); 
                }
            },
            danger: true
        });
      };
      
      const markAsRead = async (book) => {
        if (!db || !userId) return showMessage('Kullanıcı oturumu hazır değil.', 'error');
        try {
            const { id, source, ...bookData } = book;
            const q = query(collection(db, `artifacts/${appId}/users/${userId}/readBooks`));
            const querySnapshot = await getDocs(q);
            const exists = querySnapshot.docs.some(doc => doc.data().title.toLocaleLowerCase('tr-TR') === bookData.title.toLocaleLowerCase('tr-TR') && doc.data().authors.toLocaleLowerCase('tr-TR') === bookData.authors.toLocaleLowerCase('tr-TR'));
            if (!exists) {
                await addDoc(collection(db, `artifacts/${appId}/users/${userId}/readBooks`), {
                    ...bookData,
                    readDate: getTodayDate()
                });
            }
            showMessage(`${book.title} okundu olarak işaretlendi!`, 'success');
        } catch (e) {
            showMessage('İşlem sırasında bir hata oluştu.', 'error');
        }
      };

      const handleLogin = async () => {
        if (!email || !password) return setAuthError('E-posta ve şifre girin.');
        try { await signInWithEmailAndPassword(auth, email, password); } catch (e) { setAuthError('Yanlış e-posta veya şifre.'); }
      };

      const handleRegister = async () => {
        if (!email || !password) return setAuthError('E-posta ve şifre girin.');
        try { await createUserWithEmailAndPassword(auth, email, password); } 
        catch (e) {
            if (e.code === 'auth/weak-password') setAuthError('Şifre en az 6 karakter olmalıdır.');
            else if (e.code === 'auth/email-already-in-use') setAuthError('Bu e-posta zaten kullanımda.');
            else setAuthError('Kayıt olurken bir hata oluştu.');
        }
      };
      
      const handleSignOut = async () => {
        try { await signOut(auth); setReadBooks([]); setLibraryBooks([]); setUserName(''); setUserSurname(''); setEmail(''); setPassword(''); } 
        catch (e) { showMessage('Çıkış yaparken hata oluştu.', 'error'); }
      };

      const filteredReadBooks = readBooks.filter(book => book.title.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(readBooksFilterTerm.toLocaleLowerCase('tr-TR'))));
      
      const sortedReadBooks = [...filteredReadBooks].sort((a, b) => {
          const dateA = a.readDate || '';
          const dateB = b.readDate || '';
          if (dateA === dateB) return 0;
          if (!dateA) return 1;
          if (!dateB) return -1;
          return dateB.localeCompare(dateA); 
      });

      const filteredLibraryBooks = libraryBooks.filter(book => book.title.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR')) || (book.authors && book.authors.toLocaleLowerCase('tr-TR').includes(libraryFilterTerm.toLocaleLowerCase('tr-TR'))));

      if (!isAuthReady) return <div className="min-h-screen flex items-center justify-center text-white text-xl">Yükleniyor...</div>;

      if (!userId) {
        return (
          <div className="min-h-screen bg-slate-900 py-12 px-4 text-slate-100 flex items-center justify-center">
            {message && (<div className={`fixed top-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-lg z-50 ${message.type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white`}>{message.content}</div>)}
            <div className="bg-slate-800 p-8 rounded-xl shadow-lg w-full max-w-md">
              <h2 className="text-3xl font-bold text-center mb-6 text-slate-100">{isLoginMode ? 'Giriş Yap' : 'Kaydol'}</h2>
              {authError && <p className="text-red-400 text-center mb-4">{authError}</p>}
              <input type="email" placeholder="E-posta" className="w-full p-3 mb-4 bg-slate-700 rounded-lg text-white" value={email} onChange={(e) => setEmail(e.target.value)} />

          {showStats && (
            <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm flex flex-col z-50 p-4 sm:p-6 md:p-12">
              <div className="bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl flex-1 flex flex-col min-h-0 w-full max-w-5xl mx-auto border border-slate-700">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-3xl font-bold text-slate-100">İstatistikler</h2>
                  <button onClick={() => { setShowStats(false); setSelectedAuthorName(''); setSelectedPublisherName(''); setStatsSearchTerm(''); setSelectedBookDetails(null); }} className="text-slate-400 hover:text-white text-3xl bg-slate-700 hover:bg-slate-600 w-10 h-10 rounded-full flex items-center justify-center transition-colors">&times;</button>
                </div>
                
                {selectedBookDetails ? (
                  <div className="flex-1 flex flex-col min-h-0">
                    <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-700">
                        <button onClick={() => setSelectedBookDetails(null)} className="p-2 bg-slate-700 rounded-full text-slate-300 hover:text-white hover:bg-slate-600 transition-colors" aria-label="Geri Dön">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h3 className="text-2xl font-bold text-slate-100">Kitap Detayı</h3>
                    </div>
                    <div className="max-w-2xl">
                      <div className="bg-slate-700/50 p-6 rounded-2xl border border-slate-600 flex flex-col gap-4">
                          <div>
                            <p className="font-bold text-white text-2xl mb-2">{selectedBookDetails.title}</p>
                            <p className="text-emerald-400 text-lg mb-4">{selectedBookDetails.authors}</p>
                            <div className="grid grid-cols-2 gap-4 bg-slate-800/50 p-4 rounded-xl">
                                <div>
                                    <p className="text-xs text-slate-400 uppercase tracking-wider mb-1">Yayınevi</p>
                                    <p className="text-sm text-slate-200 font-medium">{selectedBookDetails.publisher && selectedBookDetails.publisher !== 'Yayınevi Bilgisi Yok' ? selectedBookDetails.publisher : '-'}</p>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 uppercase tracking-wider mb-1">Okuma Tarihi</p>
                                    <p className="text-sm text-sky-300 font-medium">{selectedBookDetails.readDate ? formatDisplayDate(selectedBookDetails.readDate) : '-'}</p>
                                </div>
                            </div>
                          </div>
                          <div className="flex gap-3 mt-4 pt-4 border-t border-slate-600/50">
                            <button onClick={() => { openEditModal(selectedBookDetails, 'read'); setShowStats(false); }} className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition-colors flex items-center gap-2">
                              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                              Düzenle
                            </button>
                          </div>
                      </div>
                    </div>
                  </div>
                ) : selectedAuthorName ? (
                  <div className="flex-1 flex flex-col min-h-0">
                    <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-700">
                        <button onClick={() => {setSelectedAuthorName(''); setSelectedAuthorBooks([]);}} className="p-2 bg-slate-700 rounded-full text-slate-300 hover:text-white hover:bg-slate-600 transition-colors" aria-label="Geri Dön">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h3 className="text-2xl font-bold text-slate-100">{selectedAuthorName} Kitapları <span className="text-slate-400 text-xl font-medium">({selectedAuthorBooks.length})</span></h3>
                    </div>
                    <div className="overflow-y-auto modal-scroll pr-3">
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {selectedAuthorBooks.map((title, i) => (
                            <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-slate-700/50 p-4 rounded-xl border border-slate-600 hover:border-blue-500 hover:bg-slate-700 cursor-pointer transition-all flex items-center justify-between group">
                                <span className="font-semibold text-slate-200 group-hover:text-white">{title}</span>
                                <svg className="w-5 h-5 text-slate-500 group-hover:text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : selectedPublisherName ? (
                  <div className="flex-1 flex flex-col min-h-0">
                    <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-700">
                        <button onClick={() => {setSelectedPublisherName(''); setSelectedPublisherBooks([]);}} className="p-2 bg-slate-700 rounded-full text-slate-300 hover:text-white hover:bg-slate-600 transition-colors" aria-label="Geri Dön">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h3 className="text-2xl font-bold text-slate-100">{selectedPublisherName} Kitapları <span className="text-slate-400 text-xl font-medium">({selectedPublisherBooks.length})</span></h3>
                    </div>
                    <div className="overflow-y-auto modal-scroll pr-3">
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {selectedPublisherBooks.map((title, i) => (
                            <div key={i} onClick={() => handleBookClickInStats(title)} className="bg-slate-700/50 p-4 rounded-xl border border-slate-600 hover:border-blue-500 hover:bg-slate-700 cursor-pointer transition-all flex items-center justify-between group">
                                <span className="font-semibold text-slate-200 group-hover:text-white">{title}</span>
                                <svg className="w-5 h-5 text-slate-500 group-hover:text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="mb-6">
                      <nav className="flex gap-2 p-1 bg-slate-900 rounded-xl w-fit">
                        <button onClick={() => setStatsTab('authors')} className={`px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${statsTab === 'authors' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>Yazarlar</button>
                        <button onClick={() => setStatsTab('publishers')} className={`px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${statsTab === 'publishers' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>Yayınevleri</button>
                      </nav>
                    </div>
                    <div className="flex-1 flex flex-col min-h-0">
                      <div className="relative mb-6">
                        <input type="text" placeholder={`${statsTab === 'authors' ? 'Yazar' : 'Yayınevi'} ara...`} className="w-full p-4 pr-10 bg-slate-700 rounded-xl text-white border border-slate-600 focus:border-blue-500 outline-none transition-colors" value={statsSearchTerm} onChange={(e) => setStatsSearchTerm(e.target.value)} />
                        {statsSearchTerm && <button onClick={() => setStatsSearchTerm('')} className="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-white">&times;</button>}
                      </div>
                      <div className="flex-1 overflow-y-auto modal-scroll pr-3">
                        {statsTab === 'authors' && (getAuthorStats().length === 0 ? (<p className="text-slate-400 text-center py-10">Yazar istatistiği bulunamadı.</p>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {getAuthorStats().map(([authorName, data]) => (
                                    <div key={authorName} onClick={() => handleAuthorClick(authorName, data.books)} className="bg-slate-700/50 p-5 rounded-xl border border-slate-600 hover:border-emerald-500/50 hover:bg-slate-700 cursor-pointer transition-all flex flex-col justify-between group">
                                        <span className="text-lg font-bold text-slate-100 mb-4 group-hover:text-emerald-400 transition-colors">{authorName}</span>
                                        <div className="flex justify-between items-center">
                                            <span className="px-3 py-1 bg-slate-800 text-emerald-400 text-xs font-bold rounded-lg border border-slate-600">{data.count} Kitap</span>
                                            <svg className="w-5 h-5 text-slate-500 group-hover:text-emerald-400 opacity-0 group-hover:opacity-100 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                        {statsTab === 'publishers' && (getPublisherStats().length === 0 ? (<p className="text-slate-400 text-center py-10">Yayınevi istatistiği bulunamadı.</p>) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {getPublisherStats().map(([publisherName, data]) => (
                                    <div key={publisherName} onClick={() => handlePublisherClick(publisherName, data.books)} className="bg-slate-700/50 p-5 rounded-xl border border-slate-600 hover:border-blue-500/50 hover:bg-slate-700 cursor-pointer transition-all flex flex-col justify-between group">
                                        <span className="text-lg font-bold text-slate-100 mb-4 group-hover:text-blue-400 transition-colors">{publisherName}</span>
                                        <div className="flex justify-between items-center">
                                            <span className="px-3 py-1 bg-slate-800 text-blue-400 text-xs font-bold rounded-lg border border-slate-600">{data.count} Kitap</span>
                                            <svg className="w-5 h-5 text-slate-500 group-hover:text-blue-400 opacity-0 group-hover:opacity-100 transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

</body>
</html>
